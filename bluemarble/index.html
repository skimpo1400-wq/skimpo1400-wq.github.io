}
function sellPlan(s,i){ // 통행료 낮은 건물부터, 그다음 땅
  const items=[];
  for(let c=0;c<40;c++) if(s.owner[c]===i){ const cell=boardOf(s)[c], b=s.bld[c];
    if(cell.t==='city'){ if(b.v)items.push({c,w:'v',val:cell.cost.v,score:cell.toll.v1}); if(b.b)items.push({c,w:'b',val:cell.cost.b,score:cell.toll.b}); if(b.h)items.push({c,w:'h',val:cell.cost.h,score:cell.toll.h}); }
    items.push({c,w:'land',val:landValue(s,c),score:toll(s,c)*3+cell.price}); }
  items.sort((a,b)=>(a.w==='land')-(b.w==='land')||a.score-b.score);

}
function sellOne(s,i,c,w){
  const cell=boardOf(s)[c], b=s.bld[c]; if(s.owner[c]!==i)return 0; let val=0;
  if(w==='land'){ val=Math.floor(landValue(s,c)*s.rules.sellRate); s.owner[c]=-1; s.bld[c]={v:0,b:0,h:0}; }
  else { if(!cell.cost||!b[w])return 0; val=Math.floor(cell.cost[w]*s.rules.sellRate); b[w]--; }

}
function autoSell(s,i,need){ const pl=P(s,i); let guard=0; while(pl.money<need && guard++<200){ const it=sellPlan(s,i)[0]; if(!it)break; sellOne(s,i,it.c,it.w); } }

function bankrupt(s,i,o){

function quit(s,i){

  if(i===s.turn){ s.ops=[{op:'nextTurn'}]; s.pend=null; s.lastDbl=false; }

function checkOver(s){

  s.over=true; s.phase='over'; s.pend=null; s.ops=[]; s.winner=al[0].i; ev(s,{t:'over',winner:s.winner,by:'laps'});

// ---------- 황금열쇠 ----------
function drawCard(s,p){
  if(!s.deck.length){ s.deck=shuffle(s,s.discard.splice(0)); ev(s,{t:'reshuffle'}); }
  if(!s.deck.length){ ev(s,{t:'card',p:p.i,k:-1}); return; }
  const k=s.deck.shift(); const c=CARDS[k]; p.st.keys++; if(c.good)p.st.goodKeys++;
  s.lastCard={k,p:p.i}; ev(s,{t:'card',p:p.i,k,id:c.id,good:c.good});
  if(c.keep){ p.keys[c.id]++; } else s.discard.push(k);
  push(s,{op:'cardFx',k});
}
function cardFx(s,p,o){

  case 'halfsale':{
    let best=-1,bv=0; for(let x=0;x<40;x++) if(s.owner[x]===p.i){ const v=landValue(s,x); if(v>bv){bv=v;best=x;} }
    if(best<0){ ev(s,{t:'halfNone',p:p.i}); return; }
    const val=Math.floor(bv/2); s.owner[best]=-1; s.bld[best]={v:0,b:0,h:0}; give(s,p.i,val); ev(s,{t:'halfsale',p:p.i,c:best,amt:val,lost:bv}); return; }
  case 'incometax': case 'repair': case 'security':{
    const n=buildingCount(s,p.i); const amt=n.h*c.rate.h+n.b*c.rate.b+n.v*c.rate.v;
    if(amt<=0){ ev(s,{t:'noBuild',p:p.i}); return; }
    push(s,{op:'pay',from:p.i,to:'bank',amt,why:c.id}); return; }
  case 'back2': case 'back3': push(s,{op:'back',n:c.n2}); return;
  case 'tour5': case 'tour25': case 'tour39': push(s,{op:'moveTo',to:c.to}); return;
  case 'storm': push(s,{op:'island',why:'card'}); return;
  case 'fundgo': push(s,{op:'moveTo',to:POS.fundIn}); return; // 도착하면 기금 받음
  case 'worldtour': push(s,{op:'moveTo',to:p.pos,full:true,fundPass:true}); return;
  case 'spaceinv':{ // 우주여행 칸으로 이동 후 다음 차례 무료 우주여행
    let n=(POS.space-p.pos+40)%40; const path=[]; let pos=p.pos, ps=false; for(let k=0;k<n;k++){ pos=(pos+1)%40; path.push(pos); if(pos===0)ps=true; }
    p.pos=POS.space; ev(s,{t:'move',p:p.i,path}); if(ps){ give(s,p.i,s.rules.salary); p.laps++; ev(s,{t:'salary',p:p.i,amt:s.rules.salary}); }
    push(s,{op:'spaceSet',free:true}); return; }
  case 'cruise': rideTo(s,p,POS.queen,POS.beijing); return;
  case 'flight': rideTo(s,p,POS.concorde,POS.taipei); return;
  case 'highway': push(s,{op:'moveTo',to:0}); return;
  case 'nobel': case 'lotto': case 'race': case 'scholar': case 'pension': give(s,p.i,c.amt); ev(s,{t:'gain',p:p.i,amt:c.amt,why:c.id}); return;
  case 'study': case 'hospital': case 'speeding': push(s,{op:'pay',from:p.i,to:'bank',amt:c.amt,why:c.id}); return;
  case 'birthday': case 'talent':{
    const ops=[]; for(const q of s.players) if(q.alive && q.i!==p.i) ops.push({op:'pay',from:q.i,to:p.i,amt:c.amt,why:c.id,auto:true});
    push(s,...ops); return; }
  }
}
// 탈것 타고 이동: 탈것까지 가서(주인 있으면 승선료) 목적지로
function rideTo(s,p,via,dest){
  const n1=(via-p.pos+40)%40; const path=[]; let pos=p.pos, ps=0;
  for(let k=0;k<n1;k++){ pos=(pos+1)%40; path.push(pos); if(pos===0)ps++; }
  p.pos=via; if(path.length)ev(s,{t:'move',p:p.i,path});
  if(ps){ give(s,p.i,s.rules.salary); p.laps++; ev(s,{t:'salary',p:p.i,amt:s.rules.salary}); }
  const ops=[]; const ow=s.owner[via];
  if(ow>=0 && ow!==p.i) ops.push({op:'pay',from:p.i,to:ow,amt:boardOf(s)[via].toll.land,why:'ride',c:via});
  ops.push({op:'moveTo',to:dest});

// ---------- 행동 ----------
// action: {type, p, ...}
function legal(s,a){
  if(s.over)return 'over';
  if(a.type==='QUIT')return P(s,a.p)&&P(s,a.p).alive?null:'dead';
  if(!s.pend)return 'nopend';
  if(a.p!==s.pend.p)return 'notyou';

}
function step(s,a){

      if(dbl){ p.island=0; ev(s,{t:'islandOut',p:p.i,how:'double'}); s.lastDbl=false; push(s,{op:'moveBy',n:d1+d2},{op:'afterLand'}); }
      else { p.island--; if(p.island<=0){ ev(s,{t:'islandOut',p:p.i,how:'time'}); } else ev(s,{t:'islandStay',p:p.i,left:p.island}); push(s,{op:'endTurn'}); }
      return done(s);
    }
    clear(); if(dbl)p.st.dbls++;
    s.dbl=dbl?s.dbl+1:0;
    ev(s,{t:'dice',p:p.i,d:[d1,d2],dbl,n:s.dbl});
    if(s.dbl>=3){ ev(s,{t:'triple',p:p.i}); s.dbl=0; push(s,{op:'island',why:'triple'},{op:'endTurn'}); return done(s); }
    s.lastDbl=dbl;

  case 'BUY':{
    const c=pd.c, cell=boardOf(s)[c]; if(p.money<cell.price)return {ok:false,err:'money'};
    clear(); take(s,p.i,cell.price); s.owner[c]=p.i; p.st.buys++; ev(s,{t:'buy',p:p.i,c,amt:cell.price});

  case 'SKIP':{
    if(s.phase==='pass'){ clear(); push(s,{op:'pay',from:p.i,to:pd.to,amt:pd.amt,why:'toll',c:pd.c}); return done(s); }
    clear(); return done(s); }
  case 'PASS':{ clear(); p.keys.pass--; s.discard.push(CARDS.findIndex(c=>c.id==='pass')); ev(s,{t:'usePass',p:p.i,c:pd.c,amt:pd.amt,to:pd.to}); return done(s); }
  case 'BUILD':{
    const c=a.c!=null?a.c:pd.c; const o=buildOptions(s,p.i,c); if(!o)return {ok:false,err:'cell'};
    if(s.phase==='build' && c!==pd.c)return {ok:false,err:'cell'};
    if(s.phase==='roll' && s.rules.buildWhen!=='any')return {ok:false,err:'rule'};
    const w=a.w||{}; const nv=Math.max(0,Math.min(o.v,w.v|0)), nb=w.b?Math.min(1,o.b):0, nh=w.h?Math.min(1,o.h):0;
    const cost=nv*o.cost.v+nb*o.cost.b+nh*o.cost.h; if(cost<=0||cost>p.money)return {ok:false,err:'money'};
    take(s,p.i,cost); const b=s.bld[c]; b.v+=nv; b.b+=nb; b.h+=nh; p.st.built+=nv+nb+nh; p.st.hotels+=nh;
    ev(s,{t:'build',p:p.i,c,w:{v:nv,b:nb,h:nh},amt:cost,zone:boardOf(s)[c].zone});

    const v=sellOne(s,p.i,a.c,a.w); if(!v)return {ok:false,err:'sell'};

  case 'GIVEUP':{ clear(); const o=s.ops.shift(); bankrupt(s,p.i,o); return done(s); }
  case 'SPACE':{

function done(s){ run(s); return {ok:true}; }

// ---------- 컴퓨터 ----------
// 성향: careful(알뜰) / normal / bold(공격)
function dangerLevel(s,i){ // 상대 땅 최대 통행료(앞으로 12칸 안) 기준 위험 금액
  const p=P(s,i); let mx=0,sum=0,cnt=0;
  for(let k=2;k<=12;k++){ const c=(p.pos+k)%40; if(s.owner[c]>=0&&s.owner[c]!==i){ const t=toll(s,c); mx=Math.max(mx,t); sum+=t*PROB[k]; } }
  let gmax=0; for(let c=0;c<40;c++) if(s.owner[c]>=0&&s.owner[c]!==i) gmax=Math.max(gmax,toll(s,c));
  return {near:mx,exp:sum,gmax};
}
const PROB=[0,0,1/36,2/36,3/36,4/36,5/36,6/36,5/36,4/36,3/36,2/36,1/36];
function reserve(s,i,style){
  const d=dangerLevel(s,i); const k=style==='bold'?0.45:style==='careful'?1.1:0.75;
  return Math.max(m(10), Math.min(d.gmax*0.6, d.near*k+d.exp*2));
}
function aiDecide(s,style){
  const pd=s.pend; if(!pd)return null; const i=pd.p, p=P(s,i); style=style||'normal';
  const R=reserve(s,i,style);
  switch(s.phase){
  case 'roll':{
    if(s.rules.buildWhen==='any'){ const b=aiBuildAny(s,i,R,style); if(b)return b; }
    return {type:'ROLL',p:i}; }
  case 'island':{
    const d=dangerLevel(s,i);
    if(pd.canEscape && d.gmax<m(80)) return {type:'ESCAPE',p:i};
    return {type:'ROLL',p:i}; }
  case 'buy':{
    const cell=boardOf(s)[pd.c]; const after=p.money-pd.price;
    const want=cell.t==='spot'&&cell.kind==='capital' ? after>=R*0.5 : after>=R*(style==='bold'?0.6:1);
    return {type:want?'BUY':'SKIP',p:i}; }
  case 'build':{ const w=aiBuildChoice(s,i,pd.c,R,style); return w?{type:'BUILD',p:i,c:pd.c,w}:{type:'SKIP',p:i}; }
  case 'pass':{ const use=pd.amt>=m(30)||pd.amt>p.money; return {type:use?'PASS':'SKIP',p:i}; }
  case 'space':{ return {type:'SPACE',p:i,to:aiSpaceTarget(s,i)}; }
  case 'debt':{ return {type:'AUTOSELL',p:i}; }
  }
  return null;
}
function aiBuildChoice(s,i,c,R,style){
  const o=buildOptions(s,i,c); if(!o)return null; const p=P(s,i), cell=boardOf(s)[c]; let money=p.money-R; const w={v:0,b:0,h:0};
  // 수익률 높은 순: 호텔·빌딩 먼저(지역 1은 빌딩 효율 낮음)
  const opts=[];
  if(o.h)opts.push(['h',cell.cost.h,cell.toll.h]); if(o.b)opts.push(['b',cell.cost.b,cell.toll.b]);
  if(o.v){ const b=s.bld[c]; const inc=b.v===0?cell.toll.v1:cell.toll.v2-cell.toll.v1; opts.push(['v',cell.cost.v,inc]); }

    ttlOf(n){

      if(this.killed)return;
      this.pump();
    }

}

  }
  /* 끝 */
  finish(){ if(this.finished)return; this.finished=true; clearTimeout(this.aiT); const s=this.s;
    if(!this.online)localStorage.removeItem(SK+'save');
    const gains=[]; const mine=this.online?[this.meta.mySeat]:this.localHumans(); for(const i of mine){ if(i==null||!s.players[i])continue; gains.push(recordGame(s,i,this.online)); }

Game.prototype.quitSeat=function(i){

    this.ff=true; this.lastEv=Math.max(this.lastEv,this.s.evId-3); }

};

function ptsFor(s,i){ const n=s.players.length, p=s.players[i]; const rank=p.rank||n; const win=s.winner===i;
  return 10+Math.round((n-rank)/Math.max(1,n-1)*30)+(win?30+5*n:0); }
function recordGame(s,i,online){
  const p=s.players[i]; const r=getRec(p.ch); const before=Object.assign({},r); const oldG=gradeOf(r.points); const oldT=TITLES.filter(t=>t.f(r)).map(t=>t.id);
  const win=s.winner===i; const pts=ptsFor(s,i)+(online?10:0); const st=p.st;
  r.games++; if(win){ r.wins++; r.streak++; r.bestStreak=Math.max(r.bestStreak,r.streak); if(s.owner[39]===i)r.seoulWins++; } else r.streak=0;
  r.points+=pts; r.ruined+=st.ruined; if(p.out==='bankrupt')r.bankrupts++; r.maxAsset=Math.max(r.maxAsset,st.maxAsset); r.maxTollRecv=Math.max(r.maxTollRecv,st.maxTollRecv); r.maxTollPaid=Math.max(r.maxTollPaid,st.maxToll);
  r.tollRecv+=st.tollRecv; r.islands+=st.islands; r.keys+=st.keys; r.goodKeys+=st.goodKeys; r.built+=st.built; r.hotels+=st.hotels; r.spaceTrips+=st.spaceTrips; r.dbls+=st.dbls; if(online)r.online++; r.last=Date.now();
  putRec(r); const newG=gradeOf(r.points); const newT=TITLES.filter(t=>t.f(r)&&!oldT.includes(t.id));
  const unl=[]; if(newG>oldG) for(const k in COS) for(const c of COS[k]) if(c.g>oldG&&c.g<=newG)unl.push(c.n);
  return {i,ch:p.ch,name:p.name,pts,oldG,newG,newT,unl,win,rank:p.rank,r};
}

  else FX.confetti(110);

  (async()=>{ await VOICE.stop(); await VOICE.narr('N08',{hold:true}); if(!$('result').classList.contains('on'))return;
    if(W) await VOICE.say(W.ch,'win',{hold:true,onSay:it=>resAv&&resAv.say(VOICE.text(it.id),2600)}); if(!$('result').classList.contains('on'))return;
    const losers=s.players.filter(p=>p.i!==w); if(losers.length){ const l=losers[Math.floor(Math.random()*losers.length)]; await VOICE.say(l.ch,'lose',{hold:true}); } })();
  if($('rAgain'))$('rAgain').onclick=()=>{ SND.click(); VOICE.stop(); const m=g.meta; const seats=m.seats.map(st=>Object.assign({},st,{cos:st.kind==='human'?myCos(st.ch):st.cos})); const s2=BM.newGame({seats,board:s.board,rules:Object.assign({},s.rules),seed:(Math.random()*4294967295)>>>0}); startGame(s2,Object.assign({},m,{seats}),{}); };
  $('rRec').onclick=()=>{ SND.click(); openRecords(gains[0]&&gains[0].ch); };
  $('rHome').onclick=()=>{ SND.click(); VOICE.stop(); if(g.online&&window.ONLINE)ONLINE.leave(true); if(G){G.stop();G=null;} show('home'); renderHome(); };
}

   ${Object.entries({border:'말 테두리',dice:'주사위',skin:'건물 모양',win:'우승 효과'}).map(([k,lab])=>`<div style="font-weight:900;margin-top:8px">${lab}</div><div class="cos">${COS[k].map(c=>`<button class="${c.g>g?'lock':''} ${myCos(ch)[k]===c.id?'on':''}" data-ck="${k}" data-cv="${c.id}">${c.g>g?'🔒 ':''}${c.n}${c.g>g?` <small>(${GRADES[c.g].n})</small>`:''}</button>`).join('')}</div>`).join('')}</div>

function localRanks(){ return Object.values(getRecs()).filter(r=>r.games>0).map(r=>Object.assign(emptyRec(r.ch),r)); }
function mergeRanks(list){ const m={}; for(const r of localRanks())m[r.ch]=r; for(const r of list){ const k=r.ch; if(!m[k]||(r.points||0)>m[k].points)m[k]=Object.assign(emptyRec(k),r); } return Object.values(m); }

async function createRoom(){

  const ref=F().doc(RC()); const me=SET.myCh||'HM';
  const ls_=SET.lastSetup||{}; const opts={n:4,board:'world',speed:SET.speed||'normal',start:293,twoDouble:true,endMode:'last',laps:20,buildWhen:'land',buildOnBuy:true,sellRate:1,ai:'normal'};
  ['board','start','twoDouble','endMode','laps','buildWhen','buildOnBuy','sellRate','ai'].forEach(k=>{ if(ls_[k]!=null)opts[k]=ls_[k]; });
  const slots=[{kind:'human',uid:ON.uid,dev:DEV,ch:me,rec:myRec(me),cos:myCos(me)}]; for(let i=1;i<8;i++)slots.push({kind:'empty'});

async function joinByCode(code){ try{ await auth(); }catch(e){ toast('인터넷 연결을 확인해 주세요'); return false; }

  const c=s.docs.map(d=>[d.id,d.data()]).filter(([,r])=>!['closed','over'].includes(r.status)&&!!r.test===QA).sort((a,b)=>b[1].createdAt-a[1].createdAt)[0];
  if(!c){ toast('그 번호의 방이 없어요 😢'); return false; }
  if(c[1].status==='playing'){ const st=sess(); if(c[1].seats&&c[1].seats.some(x=>x.dev===DEV))return rejoin(c[0],c[1]); toast('지금 게임 중인 방이에요'); return false; }

async function joinRoom(rid,rejoinSeat){

function enterRoom(){

function hostListen(){

function clientBeat(){

/* 방장: 들어오기 처리 + 접속 확인 */
function hostJoins(snap){
  const r=ON.room; if(!r)return; let sl=r.slots.slice(); let changed=false;
  snap.docChanges().forEach(ch=>{ const j=ch.doc.data(); const uid=ch.doc.id;
    if(ch.type==='removed'){ delete ON.presence[uid]; if(r.status==='waiting'){ const k=sl.findIndex(x=>x.uid===uid); if(k>0){ sl[k]={kind:'empty'}; changed=true; } } return; }
    ON.presence[uid]=j.lastSeen||Date.now();
    if(j.status==='pending'){
      if(r.status==='playing'){ // 다시 들어오기
        const k=r.seats?r.seats.findIndex(x=>x.dev===j.dev||x.uid===uid):-1;
        if(k>=0&&G&&G.s.players[k]&&G.s.players[k].alive){ const seats=r.seats.map((x,i)=>i===k?Object.assign({},x,{uid,away:false}):x); r.seats=seats; G.meta.seats=seats; G.s.players[k].uid=uid; hostSave({seats}); F().updateDoc(ch.doc.ref,{status:'ok',seat:k}).catch(()=>{}); toast(`${CHN[seats[k].ch]} 님이 돌아왔어요`); G.changed(); }
        else F().updateDoc(ch.doc.ref,{status:'busy'}).catch(()=>{});
        return; }
      let k=sl.findIndex(x=>x.uid===uid||(x.dev&&x.dev===j.dev&&x.kind==='human'));
      if(k<0){ k=sl.slice(0,r.opts.n).findIndex(x=>x.kind==='empty'); }
      if(k<0){ F().updateDoc(ch.doc.ref,{status:'full'}).catch(()=>{}); return; }
      const used=new Set(sl.filter((x,i)=>i!==k&&x.kind!=='empty').map(x=>x.ch)); let c=j.ch; if(used.has(c))c=CHARS.map(z=>z.id).find(z=>!used.has(z));
      sl[k]={kind:'human',uid,dev:j.dev,ch:c,rec:j.rec||null,cos:j.cos||null}; changed=true; F().updateDoc(ch.doc.ref,{status:'ok'}).catch(()=>{});
      SND.pop(); return; }
    if(j.status==='ok'&&r.status==='waiting'){ const k=sl.findIndex(x=>x.uid===uid); if(k>=0&&j.ch&&sl[k].ch!==j.ch){ const used=new Set(sl.filter((x,i)=>i!==k&&x.kind!=='empty').map(x=>x.ch)); if(!used.has(j.ch)){ sl[k]=Object.assign({},sl[k],{ch:j.ch,rec:j.rec||sl[k].rec,cos:j.cos||sl[k].cos}); changed=true; } } }

}
ON.sendAction=function(a){ if(!ON.rid)return; const k=G&&G.meta.mySeat; F().addDoc(RC(ON.rid,'actions'),{uid:ON.uid,seat:k,a,at:Date.now()}).catch(e=>{ console.warn(e); toast('보내기 실패, 다시 눌러 주세요'); if(G)G.decide(); }); };
ON.watchIdle=function(i,pd){ clearTimeout(ON.idleT); ON.idleT=setTimeout(()=>{ if(!G||G.dead||G.s.pend!==pd)return; const a=BM.aiDecide(G.s,'normal'); if(a){ toast(`${G.s.players[i].name} 님이 오래 생각해서 컴퓨터가 대신 했어요`); G.act(a,{ai:true}); } },TURN_MS); };
ON.gameOver=function(s){ setSess(null); };
ON.leave=async function(afterOver){
  ON.leaving=true; const r=ON.room; const rid=ON.rid;
  try{
    if(rid&&r){
      if(r.status==='waiting'){ if(ON.isHost) await F().updateDoc(RD(rid),{status:'closed'}); else if(ON.joinRef) await F().deleteDoc(ON.joinRef); }
      else if(r.status==='playing'&&G&&G.online){ const k=G.meta.mySeat;
        if(ON.isHost){ if(G.s.players[k]&&G.s.players[k].alive&&!G.s.over)BM.quit(G.s,k);
          const now=Date.now(); const cand=(r.seats||[]).find((x,i)=>x.kind==='human'&&x.uid!==ON.uid&&G.s.players[i].alive&&!x.away&&now-(ON.presence[x.uid]||0)<STALE_MS);
          ON.seq++; const patch={state:pack(G.s),seq:ON.seq,hb:Date.now()}; if(G.s.over)patch.status='over'; else if(cand)patch.hostUid=cand.uid; else patch.status='closed';
          await F().updateDoc(RD(rid),patch); }
        else { if(G.s.players[k]&&G.s.players[k].alive&&!G.s.over) await F().addDoc(RC(rid,'actions'),{uid:ON.uid,seat:k,a:{type:'QUIT'},at:Date.now()}); if(ON.joinRef) await F().deleteDoc(ON.joinRef).catch(()=>{}); }
      }
      else if(ON.joinRef) await F().deleteDoc(ON.joinRef).catch(()=>{});
    }
  }catch(e){ console.warn('leave',e); }
  stopAll(); setSess(null); if(G&&G.online){ G.stop(); G=null; } ON.rid=null; ON.room=null; ON.isHost=false; ON.joinRef=null;
  if(!afterOver){ show('home'); renderHome(); }
};
$('roomBack').onclick=()=>{ SND.click(); ON.leave(); };
/* ---------- 가족 기록 백업 ---------- */
ON.backupRec=async function(r){ await auth(); const fam=(SET.fam||'choi').slice(0,30); await F().setDoc(F().doc(F().db,'bmFamily',fam,'records',DEV+'_'+r.ch),Object.assign({},r,{dev:DEV,ch:r.ch,at:Date.now()})); };
ON.familyRanks=async function(){ await auth(); const fam=(SET.fam||'choi').slice(0,30); const snap=await F().getDocs(F().collection(F().db,'bmFamily',fam,'records')); const by={};
  snap.forEach(d=>{ const r=d.data(); if(!r.ch)return; const a=by[r.ch]||(by[r.ch]=emptyRec(r.ch)); a.games+=r.games||0; a.wins+=r.wins||0; a.points+=r.points||0; }); return Object.values(by); };
ON.restoreRecs=async function(){ await auth(); const fam=(SET.fam||'choi').slice(0,30); const snap=await F().getDocs(F().collection(F().db,'bmFamily',fam,'records')); let n=0; const R=getRecs();
  snap.forEach(d=>{ const r=d.data(); if(r.dev!==DEV||!r.ch)return; if(!R[r.ch]||(R[r.ch].points||0)<r.points){ const x=Object.assign({},r); delete x.dev; delete x.at; R[r.ch]=x; n++; } }); lsSet('rec',R); return n; };
/* 다시 열었을 때: 하던 온라인 게임 알려 주기 */
(async()=>{ const ss=sess(); if(!ss)return; try{ await auth(); const d=await F().getDoc(RD(ss.rid)); const r=d.data(); if(r&&r.status==='playing'&&r.seats&&r.seats[ss.seat]&&r.seats[ss.seat].dev===DEV){ const st=JSON.parse(r.state||'null'); if(st&&!st.over&&st.players[ss.seat].alive){ const b=$('bResume'); b.style.display=''; $('resumeInfo').textContent=`🌐 온라인 방 #${r.code}로 돌아가기`; b.onclick=()=>{ SND.click(); rejoin(ss.rid,r); }; } } else setSess(null); }catch(e){} })();
})();
</script>
