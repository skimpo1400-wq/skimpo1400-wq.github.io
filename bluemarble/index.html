<style>
:root{--gold:#ffcf4a;--ink:#2b2340;--paper:#fffaf0;--z1:#ff8a7a;--z2:#6fcf8e;--z3:#64b5f6;--z4:#b388ff;--spot:#ffc845;--bw:min(100vw - 8px, 560px);--fs:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;color:var(--ink);background:#17325a;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer;border:0}
#bgLayer{position:fixed;inset:0;background:#17325a center/cover no-repeat;transition:background-image .6s;z-index:0}
#bgLayer:after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.05),rgba(10,20,45,.55))}
.screen{position:fixed;inset:0;display:none;z-index:2;overflow:auto;-webkit-overflow-scrolling:touch;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:12px 22px;border-radius:18px;font-size:20px;font-weight:900;color:#fff;background:linear-gradient(180deg,#ff8a3d,#f05a24);box-shadow:0 5px 0 #b33d12,0 8px 18px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s;letter-spacing:-.3px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b33d12,0 3px 8px rgba(0,0,0,.25)}
.btn.blue{background:linear-gradient(180deg,#4aa3ff,#1e6fe0);box-shadow:0 5px 0 #154ea0,0 8px 18px rgba(0,0,0,.25)}
.btn.green{background:linear-gradient(180deg,#3fd17a,#18a050);box-shadow:0 5px 0 #0f7238,0 8px 18px rgba(0,0,0,.25)}
.btn.gray{background:linear-gradient(180deg,#a7b0c2,#7d879b);box-shadow:0 5px 0 #596276,0 8px 18px rgba(0,0,0,.2)}
.btn.gold{background:linear-gradient(180deg,#ffd75e,#f2a900);color:#5a3a00;box-shadow:0 5px 0 #b37b00,0 8px 18px rgba(0,0,0,.25)}
.btn.purple{background:linear-gradient(180deg,#b67cff,#7d3cf0);box-shadow:0 5px 0 #5622b0,0 8px 18px rgba(0,0,0,.25)}
.btn.sm{min-height:44px;font-size:17px;padding:8px 14px;border-radius:14px}
.btn[disabled]{filter:grayscale(.8) brightness(.9);opacity:.6;pointer-events:none}
.card{background:var(--paper);border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.3);padding:18px}
h1,h2,h3{margin:0}
/* ---------- 홈 ---------- */
#home .wrap{max-width:560px;margin:0 auto;padding:22px 16px 40px;display:flex;flex-direction:column;gap:14px;align-items:stretch;min-height:100%}
.logo{text-align:center;color:#fff;margin:6px 0 4px;position:relative}
.logo .t1{font-size:17px;font-weight:800;letter-spacing:4px;opacity:.9}
.logo .t2{font-size:44px;font-weight:900;letter-spacing:-1px;background:linear-gradient(180deg,#fff6c9,#ffc93c 55%,#ff9f1c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #8a4b00) drop-shadow(0 8px 14px rgba(0,0,0,.45));animation:logoBob 3s ease-in-out infinite}
@keyframes logoBob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-4px) rotate(1deg)}}
.fam{display:flex;justify-content:center;gap:0;height:96px;margin:2px 0 4px}
.fam img{height:96px;margin:0 -9px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4));animation:famBob 2.6s ease-in-out infinite}
.fam img:nth-child(odd){animation-delay:-1.3s}
@keyframes famBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.menu .btn{min-height:86px;font-size:21px;flex-direction:column;gap:2px}
.menu .btn small{font-size:13px;font-weight:700;opacity:.9}
.menu .wide{grid-column:1/-1}
.homeRec{color:#fff;text-align:center;font-weight:800;font-size:15px;opacity:.92}
.homeRec b{color:var(--gold)}
/* ---------- 준비 ---------- */
.pg{max-width:760px;margin:0 auto;padding:14px 12px 120px}
.pgHead{display:flex;align-items:center;gap:10px;color:#fff;margin:4px 0 12px}
.pgHead h2{font-size:24px;font-weight:900;flex:1}
.back{min-height:44px;min-width:44px;border-radius:14px;background:rgba(255,255,255,.18);color:#fff;font-size:20px;font-weight:900;padding:0 12px}
.sec{background:var(--paper);border-radius:20px;padding:14px;margin-bottom:14px;box-shadow:0 8px 22px rgba(0,0,0,.25)}
.sec h3{font-size:19px;font-weight:900;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;min-width:56px;padding:8px 14px;border-radius:14px;background:#efe6d3;font-size:18px;font-weight:900;color:#5b4a2d;border:3px solid transparent}
.chip.on{background:#fff3c4;border-color:#f2a900;color:#7a4a00;box-shadow:0 3px 0 #d79500}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.seat{position:relative;background:#fff;border-radius:16px;padding:8px;display:flex;align-items:center;gap:8px;border:3px solid #eee;min-height:78px}
.seat.sel{border-color:#ff8a3d;box-shadow:0 0 0 3px rgba(255,138,61,.25)}
.seat .face{width:58px;height:62px;flex:none;border-radius:12px;background:#f4ead6 center/cover;overflow:hidden;position:relative}
.seat .face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.seat .nm{font-weight:900;font-size:18px}
.seat .kind{margin-top:4px;font-size:14px;font-weight:800;padding:4px 8px;border-radius:10px;background:#e8f1ff;color:#1e5fc0;min-height:32px}
.seat .kind.ai{background:#f1e9ff;color:#6a32c9}
.seat .num{position:absolute;left:-6px;top:-6px;width:24px;height:24px;border-radius:50%;color:#fff;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.charBtn{background:#fff;border-radius:16px;border:3px solid #eee;padding:4px 2px 6px;font-weight:900;font-size:16px;position:relative}
.charBtn img{width:100%;aspect-ratio:300/300;object-fit:cover;object-position:50% 8%;border-radius:12px;background:#f6edda}
.charBtn.taken{opacity:.35}
.charBtn.mine{border-color:#ff8a3d}
.charBtn .grade{position:absolute;right:4px;top:4px;font-size:15px}
.boards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.boardPick{background:#fff;border-radius:18px;border:4px solid #eee;padding:8px;font-weight:900;font-size:18px;text-align:center}
.boardPick img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;display:block;margin-bottom:6px}
.boardPick small{display:block;font-size:13px;color:#7a6a50;font-weight:700}
.boardPick.on{border-color:#f2a900;box-shadow:0 0 0 4px rgba(242,169,0,.25),0 4px 0 #d79500}
.optRow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0}
.optRow>label{font-weight:900;min-width:110px;font-size:16px}
.sub{font-size:13px;color:#7a6a50;font-weight:700}
.startBar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(10,20,45,.85) 40%);display:flex;justify-content:center;z-index:5}
.startBar .btn{width:min(520px,100%);min-height:64px;font-size:23px}
/* ---------- 게임 ---------- */
#game{overflow:hidden}
.gbar{position:absolute;left:0;right:0;top:0;height:46px;padding:4px 8px;display:flex;align-items:center;gap:6px;color:#fff;z-index:20;margin-top:env(safe-area-inset-top)}
.gbar .ib{min-width:42px;height:38px;border-radius:12px;background:rgba(255,255,255,.16);color:#fff;font-size:18px;font-weight:900;padding:0 8px}
.gbar .info{flex:1;text-align:center;font-weight:900;font-size:15px;text-shadow:0 2px 4px rgba(0,0,0,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gwrap{position:absolute;left:0;right:0;top:calc(46px + env(safe-area-inset-top));bottom:env(safe-area-inset-bottom);display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 4px 4px}
#boardBox{position:relative;width:var(--bw);height:var(--bw);flex:none}
#board{position:absolute;inset:0;display:grid;grid-template-columns:1.45fr repeat(9,1fr) 1.45fr;grid-template-rows:1.45fr repeat(9,1fr) 1.45fr;gap:1.5px;background:#3b2a12;border-radius:12px;padding:1.5px;box-shadow:0 12px 30px rgba(0,0,0,.5),0 0 0 3px #e9c46a,0 0 0 6px #6b4a17}
.cell{position:relative;background:#fffaf0;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;color:#2b2340;line-height:1.05;cursor:pointer}
.cell .nm{font-size:calc(var(--cs) * .27);letter-spacing:-.6px;padding:0 1px;word-break:keep-all;position:relative;z-index:2}
.cell .pr{font-size:calc(var(--cs) * .2);color:#7a6a50;font-weight:800;margin-top:1px}
.cell .ct{display:flex;flex-direction:column;align-items:center;justify-content:center;position:absolute;inset:0;z-index:2}
.cell .band{position:absolute;z-index:1;display:flex;align-items:center;justify-content:center;gap:1px}
.side-b .band{left:0;right:0;top:0;height:28%}
.side-t .band{left:0;right:0;bottom:0;height:28%}
.side-l .band{top:0;bottom:0;right:0;width:22%;flex-direction:column}
.side-r .band{top:0;bottom:0;left:0;width:22%;flex-direction:column}
.side-b .ct{top:28%}.side-t .ct{bottom:28%}.side-l .ct{right:22%}.side-r .ct{left:22%}
.z1 .band{background:var(--z1)}.z2 .band{background:var(--z2)}.z3 .band{background:var(--z3)}.z4 .band{background:var(--z4)}
.spot .band{background:var(--spot)}
.cell.owned .band{background:var(--oc)!important;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6)}
.cell.owned:after{content:'';position:absolute;inset:0;border:2.5px solid var(--oc);pointer-events:none;z-index:3;opacity:.9}
.cell .ic{font-size:calc(var(--cs) * .34);line-height:1}
.cell.key{background:linear-gradient(135deg,#fff2b0,#ffd24a 60%,#f0a800)}
.cell.key .ic{font-size:calc(var(--cs) * .5);filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.cell.key .nm{font-size:calc(var(--cs) * .2);color:#6a4300}
.cell.corner{background:linear-gradient(135deg,#fff8de,#ffe7a8)}
.cell.corner .ic{font-size:calc(var(--cs) * .62)}
.cell.corner .nm{font-size:calc(var(--cs) * .25)}
.cell.c-start{background:linear-gradient(135deg,#ffe3e3,#ff9e9e)}
.cell.c-island{background:linear-gradient(180deg,#c7f0ff,#7fd3ff 55%,#f7e2a1 56%)}
.cell.c-fundIn{background:linear-gradient(135deg,#e9ffe0,#a6eb8c)}
.cell.c-space{background:radial-gradient(circle at 70% 30%,#5b3fc4,#1a1747 70%);color:#fff}
.cell.c-space .nm{color:#fff}
.cell.c-fundOut{background:linear-gradient(135deg,#fff,#d8f2ff)}
.cell .bl{display:flex;gap:1px;align-items:flex-end;justify-content:center}
.cell .bl i{display:block;width:calc(var(--cs)*.19);height:calc(var(--cs)*.19);background:center/contain no-repeat}
.side-l .bl,.side-r .bl{flex-direction:column}
.cell .flag{position:absolute;right:1px;top:1px;width:calc(var(--cs)*.2);height:calc(var(--cs)*.2);border-radius:50%;background:var(--oc);border:1.5px solid #fff;z-index:4;display:none}
.cell.owned .flag{display:block}
.cell.hl{animation:cellHl 1s ease-in-out infinite;z-index:5}
@keyframes cellHl{0%,100%{box-shadow:inset 0 0 0 3px #ff3d7f}50%{box-shadow:inset 0 0 0 5px #ffd400}}
.cell.pick{cursor:pointer;filter:brightness(1.05)}
.cell.pick:hover{filter:brightness(1.15)}
.cell.dim{filter:grayscale(.6) brightness(.75)}
.cell.landed{animation:landPulse .6s ease-out}
@keyframes landPulse{0%{filter:brightness(1.6)}100%{filter:none}}
.fundAmt{font-size:calc(var(--cs)*.22);color:#1d6b0c;font-weight:900}
/* 가운데 */
#center{grid-column:2/11;grid-row:2/11;position:relative;border-radius:6px;overflow:hidden;background:#fff8e6 center/cover;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px}
#center:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,rgba(255,250,235,.15),rgba(255,250,235,.55) 75%);pointer-events:none}
#center>*{position:relative;z-index:1}
.ctop{display:flex;align-items:center;gap:6px;width:100%;justify-content:center;min-height:0}
#bigAv{width:calc(var(--bw)*.24);height:calc(var(--bw)*.27);--avw:calc(var(--bw)*.24);flex:none}
.turnInfo{background:rgba(255,255,255,.92);border-radius:14px;padding:6px 10px;box-shadow:0 4px 12px rgba(0,0,0,.2);min-width:0;max-width:62%}
.turnInfo .who{font-size:calc(var(--bw)*.05);font-weight:900;display:flex;align-items:center;gap:5px;white-space:nowrap}
.turnInfo .who i{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.turnInfo .msg{font-size:calc(var(--bw)*.036);font-weight:800;color:#6a5a40;line-height:1.25;margin-top:2px}
#diceTray{display:flex;gap:calc(var(--bw)*.05);height:calc(var(--bw)*.16);align-items:center;justify-content:center;perspective:600px}
.die{width:calc(var(--bw)*.11);height:calc(var(--bw)*.11);position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,1.4,.4,1)}
.die .f{position:absolute;inset:0;border-radius:18%;background:var(--dieBg,linear-gradient(135deg,#fff,#e9e4da));border:1.5px solid rgba(0,0,0,.15);box-shadow:inset 0 0 calc(var(--bw)*.012) rgba(0,0,0,.25);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:12%}
.die .f b{width:68%;height:68%;margin:auto;border-radius:50%;background:var(--pip,#2b2340);box-shadow:inset 0 1px 1px rgba(0,0,0,.5)}
.die .f b.r{background:#e0262b}
.die .f1{transform:translateZ(calc(var(--bw)*.055))}.die .f6{transform:rotateY(180deg) translateZ(calc(var(--bw)*.055))}
.die .f2{transform:rotateY(90deg) translateZ(calc(var(--bw)*.055))}.die .f5{transform:rotateY(-90deg) translateZ(calc(var(--bw)*.055))}
.die .f3{transform:rotateX(90deg) translateZ(calc(var(--bw)*.055))}.die .f4{transform:rotateX(-90deg) translateZ(calc(var(--bw)*.055))}
.dieWrap{position:relative}
.dieWrap.bounce{animation:dieBounce var(--dd,1s) cubic-bezier(.3,.7,.4,1)}
@keyframes dieBounce{0%{transform:translate(var(--dx,-60px),-90px) scale(1.25)}35%{transform:translate(calc(var(--dx,-60px)*.4),0) scale(1)}50%{transform:translate(calc(var(--dx,-60px)*.2),-26px)}68%{transform:translate(0,0)}80%{transform:translate(0,-8px)}100%{transform:translate(0,0)}}
.dieWrap:after{content:'';position:absolute;left:10%;right:10%;bottom:-14%;height:14%;border-radius:50%;background:rgba(0,0,0,.25);filter:blur(2px)}
.dsum{position:absolute;font-weight:900;font-size:calc(var(--bw)*.06);color:#fff;text-shadow:0 2px 0 #b33d12,0 0 8px rgba(0,0,0,.4);pointer-events:none}
#actions{display:flex;flex-direction:column;gap:6px;align-items:center;width:100%;min-height:calc(var(--bw)*.15);justify-content:flex-end}
#actions .btn{min-height:calc(var(--bw)*.13);font-size:calc(var(--bw)*.052);width:min(100%,calc(var(--bw)*.62));padding:6px 10px}
#actions .row{display:flex;gap:6px;width:100%;justify-content:center}
#actions .row .btn{width:auto;flex:1}
/* 말 */
#tokens{position:absolute;inset:0;pointer-events:none;z-index:8}
.tok{position:absolute;width:var(--tk);height:var(--tk);margin:calc(var(--tk)*-.5) 0 0 calc(var(--tk)*-.5);border-radius:50%;background:#fff center/cover;border:calc(var(--tk)*.12) solid var(--pc);box-shadow:0 3px 5px rgba(0,0,0,.45);transition:left .16s ease-out,top .16s ease-out,transform .16s;overflow:hidden}
.tok img{width:100%;height:118%;object-fit:cover;object-position:50% 6%}
.tok.hop{animation:tokHop var(--hop,.19s) ease-out}
@keyframes tokHop{0%{transform:translateY(0) scale(1)}45%{transform:translateY(-45%) scale(1.15)}100%{transform:translateY(0) scale(1)}}
.tok.cur{z-index:3;box-shadow:0 0 0 3px #fff,0 0 12px 4px var(--pc),0 4px 6px rgba(0,0,0,.4)}
.tok.out{opacity:0;transform:scale(.2)}
.tok.b-silver{border-image:none;box-shadow:0 0 0 2px #e8eef5,0 0 0 3.5px #8b98a8,0 3px 5px rgba(0,0,0,.45)}
.tok.b-gold{box-shadow:0 0 0 2px #fff3b0,0 0 0 4px #e0a800,0 3px 5px rgba(0,0,0,.45)}
.tok.b-rainbow{box-shadow:0 0 0 2px #fff,0 0 0 4px #ff5fa2,0 0 0 6px #5fc8ff,0 3px 5px rgba(0,0,0,.45)}
.tok.b-crown:before{content:'👑';position:absolute;left:50%;top:-6%;transform:translateX(-50%);font-size:calc(var(--tk)*.45);z-index:2}
.tok.island{animation:tokBob 1.6s ease-in-out infinite}
@keyframes tokBob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-12%) rotate(6deg)}}
#fxLayer{position:absolute;inset:0;pointer-events:none;z-index:9;overflow:visible}
/* 플레이어 */
#side{width:var(--bw);display:flex;flex-direction:column;gap:6px;min-height:0;flex:1}
#players{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.pc{position:relative;background:rgba(255,250,240,.96);border-radius:14px;padding:3px 3px 4px;display:flex;flex-direction:column;align-items:center;border:3px solid transparent;box-shadow:0 4px 10px rgba(0,0,0,.25);min-width:0;transition:transform .2s}
.pc.cur{border-color:var(--pc);transform:translateY(-2px);box-shadow:0 0 0 2px #fff,0 0 16px var(--pc)}
.pc .av{width:100%;height:58px;--avw:52px}
.pc .nm{font-size:14px;font-weight:900;display:flex;align-items:center;gap:3px;max-width:100%;white-space:nowrap}
.pc .nm i{width:10px;height:10px;border-radius:50%;flex:none;background:var(--pc)}
.pc .mo{font-size:14px;font-weight:900;color:#0e6b2e;letter-spacing:-.4px}
.pc .as{font-size:11px;font-weight:800;color:#8a7a5a;letter-spacing:-.4px}
.pc .kys{position:absolute;right:2px;top:2px;font-size:12px;display:flex;flex-direction:column;gap:1px;z-index:6}
.pc .rk{position:absolute;left:3px;top:2px;font-size:14px;z-index:6}
.pc .gb{font-size:10px;font-weight:900;color:#7a4a00;background:#fff1b8;border-radius:8px;padding:0 4px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pc.dead{filter:grayscale(1) brightness(.85);opacity:.75}
.pc.dead:after{content:attr(data-out);position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-14deg);font-size:20px;font-weight:900;color:#d0021b;border:3px solid #d0021b;border-radius:8px;padding:0 6px;background:rgba(255,255,255,.85);z-index:7}
.pc .delta{position:absolute;left:50%;top:40%;transform:translateX(-50%);font-weight:900;font-size:17px;white-space:nowrap;z-index:9;pointer-events:none;animation:deltaUp 1.6s ease-out forwards;text-shadow:0 2px 0 #fff,0 0 6px #fff}
.pc .delta.plus{color:#0a8a38}.pc .delta.minus{color:#d0021b}
@keyframes deltaUp{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,-6px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-40px) scale(1)}}
.pc .bubble{--bubbleFs:13px}
#ticker{background:rgba(0,0,0,.35);color:#fff;border-radius:12px;padding:5px 10px;font-size:14px;font-weight:800;min-height:30px;line-height:1.35;overflow:hidden}
#ticker .l{animation:tickIn .3s ease-out}
@keyframes tickIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#logList{display:block;flex:1;min-height:0;overflow:auto;background:rgba(255,250,240,.86);border-radius:12px;padding:6px 10px;font-size:13px;font-weight:700;line-height:1.45;color:#3a2f22}
#logList div{border-bottom:1px dashed #e3d6b8;padding:1px 0}
#logList:empty{display:none}
/* 넓은 화면 */
@media (min-width:900px) and (min-aspect-ratio:5/4){
  :root{--bw:min(calc(100vh - 62px),calc(100vw - 420px),880px)}
  .gwrap{flex-direction:row;align-items:flex-start;justify-content:center;gap:16px;padding:6px 14px}
  #side{width:min(400px,calc(100vw - var(--bw) - 50px));height:calc(100vh - 62px);flex:none}
  #players{grid-template-columns:1fr 1fr;gap:8px}
  .pc{flex-direction:row;align-items:center;padding:6px;gap:6px}
  .pc .av{width:78px;height:86px;flex:none;--avw:76px}
  .pc .txt{display:flex;flex-direction:column;min-width:0;flex:1}
  .pc .nm{font-size:18px}.pc .mo{font-size:18px}.pc .as{font-size:13px}.pc .gb{font-size:12px}
  .pc .bubble{--bubbleFs:15px}
  #ticker{font-size:16px}
  #logList{display:block;flex:1;min-height:0;overflow:auto;background:rgba(255,250,240,.9);border-radius:14px;padding:8px 10px;font-size:14px;font-weight:700;line-height:1.5}
  #logList div{border-bottom:1px dashed #e3d6b8;padding:2px 0}
}
@media (max-width:899px), (max-aspect-ratio:5/4){
  .pc .txt{display:flex;flex-direction:column;align-items:center;min-width:0;width:100%}
}
/* 모달 */
#sheet{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(10,15,35,.35)}
#sheet.on{display:flex}
#sheet .box{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--paper);border-radius:24px 24px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.35);animation:sheetUp .25s cubic-bezier(.2,1.2,.4,1)}
@media (min-width:900px){ #sheet{align-items:center} #sheet .box{border-radius:24px;padding-bottom:18px} }
@keyframes sheetUp{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.dlgT{font-size:24px;font-weight:900;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dlgS{font-size:17px;font-weight:800;color:#6a5a40;margin-bottom:10px;line-height:1.4}
.deed{border-radius:16px;overflow:hidden;border:3px solid #2b2340;background:#fff;margin:6px 0 12px}
.deed .dh{padding:8px 12px;color:#fff;font-weight:900;font-size:22px;text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.deed .dh small{display:block;font-size:13px;opacity:.95}
.deed table{width:100%;border-collapse:collapse;font-size:17px;font-weight:800}
.deed td{padding:6px 12px;border-top:1px solid #eee}
.deed td:last-child{text-align:right;color:#0e6b2e}
.deed tr.now td{background:#fff6cf}
.dlgBtns{display:flex;gap:10px;margin-top:12px}
.dlgBtns .btn{flex:1}
.bopt{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:#fff;border:3px solid #eee;margin:6px 0;font-size:18px;font-weight:900;min-height:58px}
.bopt.on{border-color:#18a050;background:#e9fff0}
.bopt.no{opacity:.4;pointer-events:none}
.bopt .bi{width:34px;height:34px;flex:none;background:center/contain no-repeat}
.bopt .pr{margin-left:auto;color:#d0021b;font-size:17px}
.bopt .tg{width:28px;height:28px;border-radius:8px;border:3px solid #bbb;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.bopt.on .tg{background:#18a050;border-color:#18a050}
.sumLine{font-size:18px;font-weight:900;margin:8px 2px;display:flex;justify-content:space-between}
.sellList{display:flex;flex-direction:column;gap:6px;max-height:44vh;overflow:auto;margin:6px 0}
.sellList .row{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:6px 10px;font-weight:900;font-size:16px}
.sellList .row .btn{margin-left:auto}
/* 황금열쇠 카드 */
#keyCard{position:fixed;inset:0;z-index:45;display:none;align-items:center;justify-content:center;background:rgba(10,15,35,.55);perspective:1200px}
#keyCard.on{display:flex}
.kc{width:min(78vw,330px);aspect-ratio:3/4.1;position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.3,.5,1)}
.kc.flip{transform:rotateY(180deg)}
.kc .kf,.kc .kb{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.kc .kb{background:repeating-linear-gradient(45deg,#ffd75e 0 14px,#f2b600 14px 28px);border:6px solid #fff6d0;display:flex;align-items:center;justify-content:center;font-size:110px}
.kc .kf{transform:rotateY(180deg);background:linear-gradient(180deg,#fffdf3,#fff1c4);border:6px solid #e8b400;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;gap:10px}
.kc .kf .kt{font-size:15px;font-weight:900;color:#a06c00;letter-spacing:3px}
.kc .kf .kn{font-size:32px;font-weight:900;color:#2b2340;line-height:1.15}
.kc .kf .kd{font-size:19px;font-weight:800;color:#5b4a2d;line-height:1.45}
.kc .kf .ki{font-size:64px}
.kc.good .kf{background:linear-gradient(180deg,#fffef5,#ffe9a8);box-shadow:0 0 50px 10px rgba(255,214,64,.7),0 18px 40px rgba(0,0,0,.5)}
.kc.bad .kf{background:linear-gradient(180deg,#f7f7fb,#d9dbea);border-color:#7f86a8}
.kc.bad.shake{animation:kcShake .5s ease-in-out}
@keyframes kcShake{0%,100%{transform:rotateY(180deg)}20%{transform:rotateY(180deg) translateX(-12px) rotate(-3deg)}40%{transform:rotateY(180deg) translateX(10px) rotate(3deg)}60%{transform:rotateY(180deg) translateX(-6px)}80%{transform:rotateY(180deg) translateX(4px)}}
#keyCard .kok{position:absolute;bottom:calc(8vh + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(70vw,300px)}
/* 화면 효과 */
#fxTop{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:min(13vw,72px);font-weight:900;color:#fff;white-space:nowrap;text-shadow:0 5px 0 var(--bc,#e0262b),0 0 24px rgba(0,0,0,.5);animation:bannerIn var(--bd,1.4s) cubic-bezier(.2,1.5,.4,1) forwards;letter-spacing:-1px}
.banner small{display:block;font-size:.42em;text-align:center;text-shadow:0 3px 0 var(--bc,#e0262b),0 0 14px rgba(0,0,0,.5)}
@keyframes bannerIn{0%{transform:translate(-50%,-50%) scale(.2) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.15) rotate(2deg);opacity:1}30%{transform:translate(-50%,-50%) scale(1) rotate(0)}82%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-62%) scale(.95)}}
.shake{animation:scrShake .6s cubic-bezier(.36,.07,.19,.97)}
@keyframes scrShake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(5px,-3px)}30%,50%,70%{transform:translate(-9px,4px) rotate(-.6deg)}40%,60%{transform:translate(9px,-4px) rotate(.6deg)}}
.flashR{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,40,40,0),rgba(255,30,30,.45));animation:flashR .7s ease-out forwards}
@keyframes flashR{from{opacity:1}to{opacity:0}}
.pt{position:absolute;pointer-events:none;will-change:transform,opacity}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7b0,#ffcd1f 50%,#c78a00);border:1.5px solid #9a6a00;box-shadow:0 1px 2px rgba(0,0,0,.4);font-size:10px;font-weight:900;color:#8a5a00;display:flex;align-items:center;justify-content:center}
.bill{width:34px;height:18px;border-radius:3px;background:linear-gradient(90deg,#7bd389,#3fae5a);border:1.5px solid #1f7a37;box-shadow:0 2px 4px rgba(0,0,0,.35);font-size:9px;font-weight:900;color:#0c4a1c;display:flex;align-items:center;justify-content:center}
.bill.big{background:linear-gradient(90deg,#ffd36b,#ffac33);border-color:#a66a00;color:#5b3700}
.confetti{width:10px;height:14px;border-radius:2px}
.spark{width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,#fff,#ffe066 40%,rgba(255,200,0,0) 70%)}
.dust{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,rgba(220,200,170,.95),rgba(200,180,150,0) 70%)}
.fw{width:6px;height:6px;border-radius:50%}
.bigB{position:absolute;transform-origin:50% 100%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.4))}
.bigB.rise{animation:bRise .9s cubic-bezier(.2,1.6,.45,1) forwards}
@keyframes bRise{0%{transform:translate(-50%,-100%) scaleY(0) scaleX(.6);opacity:.4}60%{transform:translate(-50%,-100%) scaleY(1.12) scaleX(.96);opacity:1}100%{transform:translate(-50%,-100%) scale(1)}}
.bigB.fall{animation:bFall .9s cubic-bezier(.5,0,.9,.4) forwards}
@keyframes bFall{0%{transform:translate(-50%,-100%) rotate(0)}30%{transform:translate(-50%,-100%) rotate(-8deg)}100%{transform:translate(-30%,-10%) rotate(70deg);opacity:0}}
.rocket{position:absolute;font-size:44px;filter:drop-shadow(0 0 8px #ffb347)}
.trail{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,#fff,#ffb347 40%,rgba(255,100,0,0) 70%)}
.wave{position:absolute;font-size:30px}
.piggy{position:absolute;font-size:54px;transform:translate(-50%,-50%);animation:pigPop 1.6s ease-out forwards}
@keyframes pigPop{0%{transform:translate(-50%,-50%) scale(.2)}20%{transform:translate(-50%,-50%) scale(1.2)}35%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.stamp{position:absolute;transform:translate(-50%,-50%) rotate(-12deg);font-weight:900;color:#d0021b;border:4px solid #d0021b;border-radius:10px;padding:2px 10px;background:rgba(255,255,255,.9);font-size:22px;white-space:nowrap;animation:stampIn .5s cubic-bezier(.2,1.8,.4,1) forwards}
@keyframes stampIn{0%{transform:translate(-50%,-50%) rotate(-12deg) scale(3);opacity:0}100%{transform:translate(-50%,-50%) rotate(-12deg) scale(1);opacity:1}}
.crown{position:absolute;font-size:60px;transform:translate(-50%,-100%);animation:crownDrop 1s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes crownDrop{0%{transform:translate(-50%,-400%) rotate(-30deg);opacity:0}100%{transform:translate(-50%,-100%) rotate(0);opacity:1}}
.floatTxt{position:absolute;font-weight:900;font-size:22px;white-space:nowrap;transform:translate(-50%,-50%);animation:floatUp 1.5s ease-out forwards;text-shadow:0 2px 0 #fff,0 0 6px #fff}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}20%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-180%) scale(1)}}
/* 결과 */
#result{background:radial-gradient(ellipse at 50% 30%,#3a62a8,#132a52)}
.resWrap{max-width:620px;margin:0 auto;padding:20px 14px 40px;text-align:center;color:#fff}
.winAv{width:200px;height:226px;margin:30px auto 0;--avw:200px;--bubbleFs:18px}
.resTitle{font-size:38px;font-weight:900;margin:8px 0;color:var(--gold);text-shadow:0 4px 0 #8a4b00}
.rankList{background:var(--paper);color:var(--ink);border-radius:20px;padding:8px 12px;margin:12px 0;text-align:left}
.rankList .r{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px dashed #e6d8b8;font-weight:900;font-size:18px}
.rankList .r img{width:44px;height:44px;border-radius:12px;object-fit:cover;object-position:50% 8%;background:#f4ead6}
.rankList .r .v{margin-left:auto;font-size:16px;color:#0e6b2e;text-align:right}
.rankList .r .v small{display:block;color:#8a7a5a;font-size:12px}
.gain{background:rgba(255,255,255,.12);border-radius:16px;padding:10px;margin:10px 0;font-weight:800;font-size:16px;line-height:1.6}
/* 기록 */
.gradeCard{display:flex;align-items:center;gap:12px}
.gradeIc{font-size:54px}
.bar{height:16px;border-radius:10px;background:#eadfc6;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb300,#ff6a00);border-radius:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.stats div{background:#fff;border-radius:12px;padding:8px 10px;font-weight:800;font-size:15px}
.stats div b{display:block;font-size:20px;color:#1e5fc0}
.titles{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.titles span{background:#fff1b8;color:#7a4a00;border-radius:12px;padding:5px 10px;font-weight:900;font-size:15px}
.titles span.lock{background:#eee;color:#aaa}
.cos{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.cos button{min-height:46px;padding:6px 12px;border-radius:12px;background:#fff;border:3px solid #eee;font-weight:900;font-size:15px}
.cos button.on{border-color:#f2a900;background:#fff3c4}
.cos button.lock{opacity:.45}
.rankRow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:6px 10px;margin:6px 0;font-weight:900}
.rankRow img{width:42px;height:42px;border-radius:10px;object-fit:cover;object-position:50% 8%}
.rankRow .v{margin-left:auto;text-align:right;font-size:14px;color:#6a5a40}
.rules{font-size:17px;line-height:1.65;font-weight:600}
.rules h3{margin:14px 0 6px;font-size:20px}
.rules b{color:#b33d12}
.rules ul{padding-left:20px;margin:6px 0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(20,20,40,.92);color:#fff;font-weight:900;font-size:17px;padding:12px 18px;border-radius:16px;z-index:80;display:none;max-width:90vw;text-align:center}
#toast.on{display:block;animation:sheetUp .2s}
.roomList{display:flex;flex-direction:column;gap:8px}
.roomItem{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px;font-weight:900}
.roomItem .btn{margin-left:auto}
input.txt{font-size:20px;font-weight:900;padding:10px 14px;border-radius:14px;border:3px solid #e0d3b5;width:100%;min-height:52px;font-family:inherit;background:#fff}
.waitSeats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.online-dot{width:10px;height:10px;border-radius:50%;background:#3fd17a;display:inline-block}
.online-dot.off{background:#ccc}

.avatar{position:relative;display:inline-block}
.pav .pvw{position:absolute;inset:0;transform-origin:50% 100%;transition:transform .32s cubic-bezier(.3,1.5,.5,1),filter .5s}
.pav .pvs{position:absolute;inset:0;transform-origin:50% 100%}
.pav .pvb{position:absolute;inset:0;transform-origin:50% 100%;animation:pvBreath var(--bob,3s) ease-in-out infinite}
.pav .ex{position:absolute;left:0;bottom:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;opacity:0;transition:opacity .16s;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35));-webkit-user-drag:none;user-select:none;pointer-events:none}
.pav .ex.on{opacity:1}
.pav .hum{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:78%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff7e0,#f2c878);display:flex;align-items:center;justify-content:center;font-size:calc(var(--avw,120px)*.48);box-shadow:0 6px 12px rgba(0,0,0,.35);border:4px solid #fff}
.pav .pfan{position:absolute;left:50%;bottom:-4%;width:0;height:0;z-index:3}
.pav .pfan b{position:absolute;left:-9px;bottom:0;width:18px;height:27px;border-radius:3px;background:linear-gradient(135deg,#d0242a,#7a0d10);border:1.5px solid #fff;box-shadow:0 2px 3px rgba(0,0,0,.4);transform-origin:50% 140%;transform:rotate(calc(var(--i)*8deg)) translateY(-2px)}
.pav .sweat,.pav .tears{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s}
.pav .sweat i{position:absolute;font-style:normal;font-size:calc(var(--avw,120px)*.16);animation:pvSweat 1.3s ease-in infinite}
.pav .sweat i:nth-child(1){left:18%;top:16%}.pav .sweat i:nth-child(2){right:16%;top:10%;animation-delay:.6s}
.pav .tears i{position:absolute;top:36%;width:6%;height:10%;background:linear-gradient(#bfe6ff,#4aa8ff);border-radius:50% 50% 50% 50%/30% 30% 70% 70%;animation:pvTear 1s ease-in infinite;opacity:.9}
.pav .tears i:nth-child(1){left:38%}.pav .tears i:nth-child(2){left:58%;animation-delay:.5s}
.pav.m-nervous .sweat{opacity:1}
.pav.m-nervous .pvs{animation:pvTremble .5s linear infinite}
.pav.m-desperate .sweat{opacity:1}.pav.m-desperate .pvs{animation:pvTremble .18s linear infinite}
.pav.m-desperate .sweat i{animation-duration:.8s}
.pav.m-broke .tears,.pav.slumped .tears{opacity:1}
.pav.slumped .pvw{transform:translateY(12%) rotate(-5deg) scale(.94);filter:saturate(.55) brightness(.9)}
.pav.slumped .pvb{animation-duration:5s}
.pav.thinking .pvw{transform:rotate(-5deg)}
.pav.thinking.th-tiltR .pvw{transform:rotate(5deg)}
.pav.thinking.th-bounce .pvb{animation:pvBounce .5s ease-in-out infinite}
.pav.leaning .pvw{transform:translateY(7%) scale(1.1)}
.pav.lean2 .pvw{transform:translateY(12%) scale(1.18) rotate(2deg)}
.pav.pump .pvs{animation:pvPump .9s ease-out}.pav.pumpbig .pvs{animation:pvPump .45s ease-out 2}
.pav.shrug .pvs{animation:pvShrug 1s ease-in-out}
.pav.nod .pvs{animation:pvNod .9s ease-in-out}
.pav.jump .pvs{animation:pvJump .65s ease-out 2}
.pav.hop .pvs{animation:pvJump .35s ease-out 2}
.pav.sway .pvs{animation:pvSway .65s ease-in-out 2}
.pav.hoho .pvs{animation:pvHoho .25s ease-in-out 4}
.pav.recoil .pvs{animation:pvRecoil .65s cubic-bezier(.2,1.6,.4,1)}
.pav.flinch .pvs{animation:pvFlinch .5s ease-out}
.pav.trembleHard .pvs{animation:pvTremble .1s linear 9}
.pav.gulp .pvs{animation:pvGulp .9s ease-in-out}
.pav.droop .pvs{animation:pvDroop 1.2s ease-in-out}
.pav.look .pvs{animation:pvLook 1.6s ease-in-out}
.avatar .fx{position:absolute;inset:0;pointer-events:none;z-index:5}
.avatar .pop{position:absolute;left:58%;top:70%;font-weight:900;color:#fff;font-size:22px;text-shadow:0 2px 0 #7a1f1f,0 0 6px rgba(0,0,0,.4);animation:avPop 1.2s ease-out forwards;white-space:nowrap}
.avatar .pop.slam{font-size:36px;color:#ffe14d;left:50%;top:80%}
.avatar .pop.go{left:30%;top:4%;font-size:34px;color:#ff4d4d;text-shadow:0 3px 0 #fff,0 0 10px #fff}
.avatar .pop.shock{left:62%;top:6%;font-size:30px;color:#fff36b;text-shadow:0 3px 0 #b3261e}
.avatar .pop.note{left:24%;top:22%;font-size:22px;color:#ffe680;animation:avNote 1.4s ease-out forwards}
.avatar .pop.sigh{left:56%;top:40%;font-size:18px;color:#cfe8ff;animation:avNote 1.4s ease-out forwards}
.avatar .pop.dots{left:62%;top:10%;font-size:28px;color:#fff;animation:avNote 1.4s ease-out forwards}
.avatar .bubble{position:absolute;left:70%;top:-2%;transform:scale(.3);transform-origin:0 100%;opacity:0;background:#fff;color:#2a2a2a;border-radius:18px;padding:7px 13px;font-weight:800;font-size:var(--bubbleFs,16px);box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s;z-index:30;width:max-content;max-width:min(62vw,300px);white-space:normal;text-align:left;line-height:1.3;pointer-events:none}
.avatar .bubble:after{content:'';position:absolute;left:-8px;bottom:10px;border:8px solid transparent;border-left:0;border-right-color:#fff}
.avatar .bubble.flipL{left:auto;right:70%;transform-origin:100% 100%}
.avatar .bubble.flipL:after{left:auto;right:-8px;border-right:0;border-left:8px solid #fff;border-top-color:transparent;border-bottom-color:transparent}
.avatar .bubble.show{transform:scale(1);opacity:1}
.pav.talking .pvb{animation:pvTalk .32s ease-in-out infinite}
@keyframes pvBreath{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(calc(-1.2% * var(--amp,1))) scale(1.01,1.018)}}
@keyframes pvTalk{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5%) rotate(.6deg)}}
@keyframes pvBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%)}}
@keyframes pvTremble{0%{transform:translate(0,0)}25%{transform:translate(-1.6%,.5%) rotate(-.8deg)}50%{transform:translate(1.4%,-.4%)}75%{transform:translate(-.8%,.6%) rotate(.8deg)}100%{transform:translate(0,0)}}
@keyframes pvPump{0%{transform:translateY(0)}30%{transform:translateY(-12%) scale(1.06)}60%{transform:translateY(0) scale(.98,1.02)}100%{transform:none}}
@keyframes pvShrug{0%,100%{transform:none}25%{transform:translateY(-5%) scaleX(1.04) rotate(-3deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-5%) scaleX(1.04) rotate(3deg)}}
@keyframes pvNod{0%,100%{transform:none}30%{transform:translateY(3%) rotate(2deg)}60%{transform:translateY(-1%)}}
@keyframes pvJump{0%,100%{transform:none}40%{transform:translateY(-14%) scale(1.04,.98)}70%{transform:translateY(0) scale(1.03,.96)}}
@keyframes pvSway{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes pvHoho{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%) rotate(-2deg)}}
@keyframes pvRecoil{0%{transform:none}20%{transform:translate(-4%,-10%) rotate(-10deg) scale(.88)}45%{transform:translate(3%,2%) rotate(6deg) scale(1.02)}65%{transform:rotate(-4deg)}85%{transform:rotate(2deg)}100%{transform:none}}
@keyframes pvFlinch{0%,100%{transform:none}25%{transform:translateY(-5%) scale(.95)}55%{transform:translateX(-2%)}}
@keyframes pvGulp{0%,100%{transform:none}40%{transform:translateY(2%) scale(1,.97)}}
@keyframes pvDroop{0%,100%{transform:none}50%{transform:translateY(6%) rotate(-3deg) scale(.97)}}
@keyframes pvLook{0%,100%{transform:none}30%{transform:rotate(-4deg) translateX(-2%)}70%{transform:rotate(4deg) translateX(2%)}}
@keyframes pvSweat{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(160%);opacity:0}}
@keyframes pvTear{0%{transform:translateY(0) scale(.6);opacity:0}25%{opacity:.95}100%{transform:translateY(220%) scale(1);opacity:0}}
@keyframes avPop{0%{transform:translate(-50%,0) scale(.4);opacity:0}20%{transform:translate(-50%,-14px) scale(1.15);opacity:1}100%{transform:translate(-50%,-48px) scale(1);opacity:0}}
@keyframes avNote{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(-40px);opacity:0}}

.pc .avatar .bubble{left:60%;top:-8%}
</style>
</head>

": "HM", "text": "큰일 났네, 다음에 걸리면 끝이다!"}, "HM074": {"sp": "HM", "text": "아까워도 어쩌겠노, 팔아야지…"}, "HM075": {"sp": "HM", "text": "이 땅 팔아서 빚부터 갚자, 아이고."}, "HM076": {"sp": "HM", "text": "아이고, 할미가 졌다! 그래도 재밌었다~"}, "HM077": {"sp": "HM", "text": "할미 빈털터리 됐네, 다음 판에 두고 보자!"}, "HM078": {"sp": "HM", "text": "미안하다, 할미가 너무 셌나? 호호!"}, "HM079": {"sp": "HM", "text": "할미한테 덤비면 이렇게 된다~ 다음에 또 하자!"}, "HM080": {"sp": "HM", "text": "봤지? 할미가 1등으로 올라섰다!"}, "HM081": {"sp": "HM", "text": "역시 끝까지 가 봐야 아는 거다, 호호!"}, "HM082": {"sp": "HM", "text": "할미가 이겼다! 우리 식구들 다 고맙다~"}, "HM083": {"sp": "HM", "text": "세계 땅부자 할미 납시오! 호호호!"}, "HM084": {"sp": "HM", "text": "봐라, 연륜은 못 이긴다! 다음 판도 하자!"}, "HM085": {"sp": "HM", "text": "아이고 졌네, 그래도 손주들이랑 노니 좋다!"}, "HM086": {"sp": "HM", "text": "이번엔 봐준 거다, 다음 판은 할미 거다!"}, "HM087": {"sp": "HM", "text": "재밌었다, 다음엔 할미가 꼭 이긴다!"}, "HM088": {"sp": "HM", "text": "얼른 굴려라~ 할미 기다린다."}, "HM089": {"sp": "HM", "text": "누구 차례고? 빨리빨리 하자~"}, "HM090": {"sp": "HM", "text": "할미는 느긋하다, 천천히 해라."}, "HM091": {"sp": "HM", "text": "어서 온나~ 할미 땅이 기다린다!"}, "HM092": {"sp": "HM", "text": "이리 와라, 할미가 반겨 줄게~"}, "HM093": {"sp": "HM", "text": "아이고 저걸 어쩌노, 많이도 냈다!"}, "HM094": {"sp": "HM", "text": "쯧쯧, 거기 걸릴 줄 알았다~"}, "HM095": {"sp": "HM", "text": "하이고, 통행료 보니 할미 속이 다 쓰리다."}, "HM096": {"sp": "HM", "text": "저 집은 피해 다녀야겠다!"}, "HM097": {"sp": "HM", "text": "아이고, 호텔 올렸네? 무서버라~"}, "HM098": {"sp": "HM", "text": "섬에서 푹 쉬다 와라~"}, "HM099": {"sp": "HM", "text": "무인도 가서 생선이나 잡아 와라, 호호!"}, "HM100": {"sp": "HM", "text": "아이고 열쇠가 심술을 부리네!"}, "HM101": {"sp": "HM", "text": "쯧쯧, 그것도 다 복이다 생각해라."}, "HB001": {"sp": "HB", "text": "허허, 오늘 할아버지가 세계 정복 한번 해 볼까!"}, "HB002": {"sp": "HB", "text": "자자, 다들 앉아라! 왕년의 부루마블 챔피언 나가신다!"}, "HB003": {"sp": "HB", "text": "허허허, 다 모였구나! 봐주기 없기다!"}, "HB004": {"sp": "HB", "text": "던진다, 받아라!"}, "HB005": {"sp": "HB", "text": "허허, 주사위야 할아버지 체면 좀 세워 다오."}, "HB006": {"sp": "HB", "text": "자, 굴러간다~"}, "HB007": {"sp": "HB", "text": "허허, 더블이다! 한 번 더 간다!"}, "HB008": {"sp": "HB", "text": "쌍으로 나왔네, 할아버지 손이 아직 살아 있지!"}, "HB009": {"sp": "HB", "text": "이게 바로 실력이란 거다, 허허!"}, "HB010": {"sp": "HB", "text": "허허, 너무 잘 나와도 탈이구먼! 무인도 행이다!"}, "HB011": {"sp": "HB", "text": "세 번 연속이라니, 하늘도 샘을 내는구나!"}, "HB012": {"sp": "HB", "text": "이 땅, 할아버지가 접수한다!"}, "HB013": {"sp": "HB", "text": "좋아, 계약 완료다!"}, "HB014": {"sp": "HB", "text": "땅은 사 두는 거다, 할아버지 말 들어라!"}, "HB015": {"sp": "HB", "text": "허허, 큰 거 한 장 질렀다!"}, "HB016": {"sp": "HB", "text": "이 정도 땅은 할아버지급이 사야지!"}, "HB017": {"sp": "HB", "text": "통 크게 간다! 이제 다들 조심해라!"}, "HB018": {"sp": "HB", "text": "여긴 패스! 할아버지 눈엔 안 찬다."}, "HB019": {"sp": "HB", "text": "에헴, 이 땅은 할아버지 스타일이 아니야."}, "HB020": {"sp": "HB", "text": "자, 집 한 채 뚝딱!"}, "HB021": {"sp": "HB", "text": "허허, 공사 시작이다! 망치 소리 좋구나."}, "HB022": {"sp": "HB", "text": "할아버지 손으로 지은 집이다!"}, "HB023": {"sp": "HB", "text": "호텔 개업이다! 다들 쉬었다 가라, 돈은 내고!"}, "HB024": {"sp": "HB", "text": "허허허, 번쩍번쩍 호텔! 할아버지 사업 수완 봤지?"}, "HB025": {"sp": "HB", "text": "이게 바로 노후 대책이다, 허허!"}, "HB026": {"sp": "HB", "text": "허허, 통행료 여기 있다."}, "HB027": {"sp": "HB", "text": "에잉, 할아버지 돈 아껴 써라!"}, "HB028": {"sp": "HB", "text": "좋다, 통 크게 낸다!"}, "HB029": {"sp": "HB", "text": "허허… 이건 좀 아프구나!"}, "HB030": {"sp": "HB", "text": "아이쿠, 할아버지 비상금까지 다 나간다!"}, "HB031": {"sp": "HB", "text": "이 정도면 도둑이지 통행료냐, 허허!"}, "HB032": {"sp": "HB", "text": "허허, 어서 오너라! 통행료는 저 함에 넣고!"}, "HB033": {"sp": "HB", "text": "고맙다! 잘 받았다~"}, "HB034": {"sp": "HB", "text": "할아버지 땅 밟았으면 내야지!"}, "HB035": {"sp": "HB", "text": "허허허! 이게 웬 떡이냐!"}, "HB036": {"sp": "HB", "text": "통행료 대박이다! 오늘 저녁은 할아버지가 쏜다!"}, "HB037": {"sp": "HB", "text": "미안하다, 그래도 장사는 장사다! 허허!"}, "HB038": {"sp": "HB", "text": "허허, 황금열쇠가 할아버지 편이구나!"}, "HB039": {"sp": "HB", "text": "좋다 좋아, 인생은 한 방이다!"}, "HB040": {"sp": "HB", "text": "역시 할아버지는 운도 실력이다!"}, "HB041": {"sp": "HB", "text": "허허, 이것 참 고약한 열쇠로구나."}, "HB042": {"sp": "HB", "text": "에잉, 이건 못 본 걸로 하자!"}, "HB043": {"sp": "HB", "text": "하하… 웃어야지 어쩌겠냐."}, "HB044": {"sp": "HB", "text": "어디로 가라고? 좋다, 할아버지 여행 간다!"}, "HB045": {"sp": "HB", "text": "허허, 공짜 여행이면 마다할 이유가 없지!"}, "HB046": {"sp": "HB", "text": "이건 할아버지 지갑에 넣어 둔다!"}, "HB047": {"sp": "HB", "text": "허허, 비장의 무기가 생겼구나."}, "HB048": {"sp": "HB", "text": "반액대매출? 허허, 할아버지 땅이 떨이로 나가는구나!"}, "HB049": {"sp": "HB", "text": "이런 세일은 하나도 안 반갑다, 허허…"}, "HB050": {"sp": "HB", "text": "세금 내는 건 국민의 의무지, 허허…"}, "HB051": {"sp": "HB", "text": "수리비가 이렇게 나와? 할아버지가 직접 고칠걸!"}, "HB052": {"sp": "HB", "text": "짠! 우대권이다! 할아버지는 프리 패스!"}, "HB053": {"sp": "HB", "text": "허허, 이럴 때 쓰려고 모셔 둔 거다!"}, "HB054": {"sp": "HB", "text": "허허, 무인도라… 낚시나 하고 있을 테니 천천히들 해라."}, "HB055": {"sp": "HB", "text": "할아버지 휴가 간다! 찾지 마라!"}, "HB056": {"sp": "HB", "text": "이것도 다 인생이다, 허허."}, "HB057": {"sp": "HB", "text": "아직이다, 물고기가 잘 잡히는구나."}, "HB058": {"sp": "HB", "text": "허허, 배가 또 그냥 가네."}, "HB059": {"sp": "HB", "text": "탈출 성공! 할아버지 돌아왔다!"}, "HB060": {"sp": "HB", "text": "허허, 섬 생활 끝! 다시 장사하러 간다!"}, "HB061": {"sp": "HB", "text": "우주여행이라! 할아버지 생전에 달나라 가 보는구나!"}, "HB062": {"sp": "HB", "text": "허허, 로켓이다! 할아버지 우주 비행사 된다!"}, "HB063": {"sp": "HB", "text": "발사! 할아버지 날아간다!"}, "HB064": {"sp": "HB", "text": "자, 우주로 출발! 허허허!"}, "HB065": {"sp": "HB", "text": "좋은 일에 쓰라고 할아버지가 낸다!"}, "HB066": {"sp": "HB", "text": "기부는 남는 장사다, 허허."}, "HB067": {"sp": "HB", "text": "허허, 기금이 할아버지한테 왔구나!"}, "HB068": {"sp": "HB", "text": "이게 다 할아버지 덕을 쌓은 결과다!"}, "HB069": {"sp": "HB", "text": "월급날이다! 허허, 출근도 안 했는데!"}, "HB070": {"sp": "HB", "text": "한 바퀴 돌았으니 월급 받아야지!"}, "HB071": {"sp": "HB", "text": "허허… 할아버지 주머니가 바람 든다."}, "HB072": {"sp": "HB", "text": "이거 큰일이구나, 다음 칸이 무섭다!"}, "HB073": {"sp": "HB", "text": "할아버지 지금 살얼음판이다, 허허…"}, "HB074": {"sp": "HB", "text": "아까운 땅이지만 판다! 사나이는 결단이다."}, "HB075": {"sp": "HB", "text": "허허, 이 땅이랑 작별이다…"}, "HB076": {"sp": "HB", "text": "허허, 할아버지가 망했다! 잘들 놀아라~"}, "HB077": {"sp": "HB", "text": "오늘은 여기까지다! 다음 판에 복수한다!"}, "HB078": {"sp": "HB", "text": "허허, 미안하다! 장사는 냉정한 거란다."}, "HB079": {"sp": "HB", "text": "할아버지 땅이 이렇게 무섭다, 허허허!"}, "HB080": {"sp": "HB", "text": "봐라, 할아버지가 다시 1등이다!"}, "HB081": {"sp": "HB", "text": "허허, 노장은 죽지 않는다!"}, "HB082": {"sp": "HB", "text": "허허허! 할아버지가 세계 재벌이다!"}, "HB083": {"sp": "HB", "text": "이겼다! 다들 할아버지한테 절 한 번씩 해라, 허허!"}, "HB084": {"sp": "HB", "text": "역시 할아버지다! 다음 판도 덤벼라!"}, "HB085": {"sp": "HB", "text": "허허, 졌구나! 그래도 너희들 크는 거 보니 좋다!"}, "HB086": {"sp": "HB", "text": "오늘은 손주들한테 져 준 거다, 허허!"}, "HB087": {"sp": "HB", "text": "다음에 보자! 할아버지 연습해 온다!"}, "HB088": {"sp": "HB", "text": "허허, 할아버지 졸리다, 얼른 굴려라!"}, "HB089": {"sp": "HB", "text": "주사위가 무겁냐? 허허."}, "HB090": {"sp": "HB", "text": "천천히 해라, 할아버지는 차 한잔 하마."}, "HB091": {"sp": "HB", "text": "어서 와라, 할아버지 땅이 반긴다!"}, "HB092": {"sp": "HB", "text": "이리 오너라~ 허허!"}, "HB093": {"sp": "HB", "text": "허허, 저건 아프겠다!"}, "HB094": {"sp": "HB", "text": "에구, 거기 걸렸구먼. 허허!"}, "HB095": {"sp": "HB", "text": "통행료 보니 할아버지가 다 아프다!"}, "HB096": {"sp": "HB", "text": "허허, 저기 호텔 섰다! 다들 피해 다녀라."}, "HB097": {"sp": "HB", "text": "큰손 나셨구먼, 허허!"}, "HB098": {"sp": "HB", "text": "무인도 가서 할아버지 대신 낚시 좀 해라!"}, "HB099": {"sp": "HB", "text": "허허, 푹 쉬다 와라!"}, "HB100": {"sp": "HB", "text": "허허, 열쇠가 장난을 치는구나!"}, "HB101": {"sp": "HB", "text": "그런 날도 있는 거다, 힘내라!"}, "AD001": {"sp": "AD", "text": "자, 오늘 우리 집 재벌은 누가 될까요? 저겠죠!"}, "AD002": {"sp": "AD", "text": "다들 준비됐죠? 아빠 실력 보여 줄게!"}, "AD003": {"sp": "AD", "text": "어머니 아버지, 오늘은 진짜 안 봐드립니다!"}, "AD004": {"sp": "AD", "text": "간다! 좋은 숫자 나와라!"}, "AD005": {"sp": "AD", "text": "자, 아빠 굴린다~"}, "AD006": {"sp": "AD", "text": "주사위야, 아빠 좀 도와줘라!"}, "AD007": {"sp": "AD", "text": "더블! 아빠 한 번 더 간다!"}, "AD008": {"sp": "AD", "text": "오, 손이 풀렸네! 한 번 더!"}, "AD009": {"sp": "AD", "text": "이거지! 더블 나와 줬어!"}, "AD010": {"sp": "AD", "text": "아니, 세 번이나? 이건 너무하잖아!"}, "AD011": {"sp": "AD", "text": "더블 세 번이면 무인도라고? 아 진짜!"}, "AD012": {"sp": "AD", "text": "이 땅 아빠가 산다!"}, "AD013": {"sp": "AD", "text": "좋아, 투자 완료!"}, "AD014": {"sp": "AD", "text": "여기 괜찮은데? 계약!"}, "AD015": {"sp": "AD", "text": "큰마음 먹고 질렀다! 다들 조심하세요!"}, "AD016": {"sp": "AD", "text": "이 땅 잡으면 게임 끝이지!"}, "AD017": {"sp": "AD", "text": "아빠 통장 탈탈 털었다!"}, "AD018": {"sp": "AD", "text": "여긴 좀 애매한데, 패스!"}, "AD019": {"sp": "AD", "text": "돈 아껴야지, 이번엔 안 사요."}, "AD020": {"sp": "AD", "text": "자, 건물 올린다!"}, "AD021": {"sp": "AD", "text": "아빠 건설 시작합니다!"}, "AD022": {"sp": "AD", "text": "차곡차곡 짓자!"}, "AD023": {"sp": "AD", "text": "호텔 오픈! 다들 숙박하러 오세요~"}, "AD024": {"sp": "AD", "text": "이 호텔 아빠가 지었다! 통행료 각오해!"}, "AD025": {"sp": "AD", "text": "이제 여기 지나가면 지갑 조심!"}, "AD026": {"sp": "AD", "text": "통행료 여기요~"}, "AD027": {"sp": "AD", "text": "에이, 아깝지만 낸다!"}, "AD028": {"sp": "AD", "text": "다음엔 내가 받는다!"}, "AD029": {"sp": "AD", "text": "아니 이게 얼마야! 아빠 월급 다 나갔어!"}, "AD030": {"sp": "AD", "text": "헉, 통행료가 아니라 강도인데요?"}, "AD031": {"sp": "AD", "text": "아… 이건 진짜 아프다!"}, "AD032": {"sp": "AD", "text": "감사합니다, 손님!"}, "AD033": {"sp": "AD", "text": "통행료 잘 받았습니다~"}, "AD034": {"sp": "AD", "text": "아빠 땅에 오신 걸 환영합니다!"}, "AD035": {"sp": "AD", "text": "오예! 이게 바로 투자의 결실이지!"}, "AD036": {"sp": "AD", "text": "대박! 오늘 치킨은 아빠가 쏜다!"}, "AD037": {"sp": "AD", "text": "죄송합니다, 그래도 받을 건 받아야죠!"}, "AD038": {"sp": "AD", "text": "오, 좋은 거 나왔다!"}, "AD039": {"sp": "AD", "text": "황금열쇠 땡큐!"}, "AD040": {"sp": "AD", "text": "역시 아빠 운이 좋아!"}, "AD041": {"sp": "AD", "text": "아 이건 아니지!"}, "AD042": {"sp": "AD", "text": "열쇠야, 아빠한테 왜 그래!"}, "AD043": {"sp": "AD", "text": "망했다, 돈 나간다!"}, "AD044": {"sp": "AD", "text": "어디로 가래? 좋아, 출발!"}, "AD045": {"sp": "AD", "text": "공짜 여행이네? 가 보자!"}, "AD046": {"sp": "AD", "text": "이건 비상용으로 챙겨 둬야지!"}, "AD047": {"sp": "AD", "text": "좋아, 히든카드 하나 생겼다!"}, "AD048": {"sp": "AD", "text": "반액대매출? 아빠 땅이 반값이라고?"}, "AD049": {"sp": "AD", "text": "이건 진짜 너무하다… 내 제일 좋은 땅인데!"}, "AD050": {"sp": "AD", "text": "세금 폭탄이네! 건물 괜히 지었나?"}, "AD051": {"sp": "AD", "text": "수리비가 이렇게 많이 나와?"}, "AD052": {"sp": "AD", "text": "우대권 사용합니다! 공짜로 지나갈게요~"}, "AD053": {"sp": "AD", "text": "이럴 줄 알고 아껴 놨지!"}, "AD054": {"sp": "AD", "text": "무인도라니… 아빠 잠깐 휴가 다녀올게."}, "AD055": {"sp": "AD", "text": "하필 여기서 걸리냐!"}, "AD056": {"sp": "AD", "text": "혼자 섬에서 뭐 하지?"}, "AD057": {"sp": "AD", "text": "아직 못 나가네…"}, "AD058": {"sp": "AD", "text": "더블 좀 나와 줘라!"}, "AD059": {"sp": "AD", "text": "탈출! 아빠 돌아왔다!"}, "AD060": {"sp": "AD", "text": "드디어 나왔다, 이제 달린다!"}, "AD061": {"sp": "AD", "text": "우주여행이다! 어디로 갈지 생각해 봐야지."}, "AD062": {"sp": "AD", "text": "오, 로켓 탈 시간이다!"}, "AD063": {"sp": "AD", "text": "발사! 목적지로 간다!"}, "AD064": {"sp": "AD", "text": "우주 비행 출발합니다!"}, "AD065": {"sp": "AD", "text": "기부했다 치자, 좋은 일 했네."}, "AD066": {"sp": "AD", "text": "사회복지기금, 기분 좋게 냅니다!"}, "AD067": {"sp": "AD", "text": "기금 당첨! 이거 꽤 쌓였는데?"}, "AD068": {"sp": "AD", "text": "와, 공돈이다! 감사합니다!"}, "AD069": {"sp": "AD", "text": "월급날이다!"}, "AD070": {"sp": "AD", "text": "한 바퀴 돌았다, 월급 입금!"}, "AD071": {"sp": "AD", "text": "아빠 지금 위험하다…"}, "AD072": {"sp": "AD", "text": "돈이 너무 없는데, 조심해야겠다."}, "AD073": {"sp": "AD", "text": "다음에 크게 걸리면 끝이야…"}, "AD074": {"sp": "AD", "text": "아깝지만 이 땅 정리한다."}, "AD075": {"sp": "AD", "text": "눈물을 머금고 판다…"}, "AD076": {"sp": "AD", "text": "아빠 파산했다… 다들 재밌게 해!"}, "AD077": {"sp": "AD", "text": "졌다! 다음 판에 복수한다!"}, "AD078": {"sp": "AD", "text": "미안해요, 게임은 게임이니까!"}, "AD079": {"sp": "AD", "text": "죄송합니다, 제 땅이 좀 셌죠?"}, "AD080": {"sp": "AD", "text": "역전이다! 아빠가 1등!"}, "AD081": {"sp": "AD", "text": "이게 바로 뒷심이지!"}, "AD082": {"sp": "AD", "text": "아빠가 이겼다! 다들 수고했어요!"}, "AD083": {"sp": "AD", "text": "우리 집 재벌은 바로 나! 하하!"}, "AD084": {"sp": "AD", "text": "이겼다! 어머니 아버지, 죄송합니다!"}, "AD085": {"sp": "AD", "text": "졌다… 그래도 재밌었어요!"}, "AD086": {"sp": "AD", "text": "다음엔 꼭 이길 거야!"}, "AD087": {"sp": "AD", "text": "오늘은 양보한 걸로 하자!"}, "AD088": {"sp": "AD", "text": "자, 빨리빨리 굴리자~"}, "AD089": {"sp": "AD", "text": "아빠 차례 언제 와?"}, "AD090": {"sp": "AD", "text": "천천히 해도 돼, 아빠 기다릴게."}, "AD091": {"sp": "AD", "text": "어서 와, 아빠 땅으로!"}, "AD092": {"sp": "AD", "text": "이쪽으로 와라~ 환영해!"}, "AD093": {"sp": "AD", "text": "아이고, 그거 얼마야? 많이 냈다!"}, "AD094": {"sp": "AD", "text": "거기 걸렸어? 아빠가 다 아프다!"}, "AD095": {"sp": "AD", "text": "와, 통행료 장난 아니네!"}, "AD096": {"sp": "AD", "text": "호텔 올렸네? 저긴 피해 가야겠다."}, "AD097": {"sp": "AD", "text": "와, 큰손이시네!"}, "AD098": {"sp": "AD", "text": "무인도 잘 다녀와~"}, "AD099": {"sp": "AD", "text": "섬에서 기념품 사 와!"}, "AD100": {"sp": "AD", "text": "아이고, 열쇠 운이 없네!"}, "AD101": {"sp": "AD", "text": "괜찮아, 다음엔 좋은 거 나올 거야."}, "MN001": {"sp": "MN", "text": "다들 즐겁게 해요! 그래도 저 봐주는 건 없어요~"}, "MN002": {"sp": "MN", "text": "어머님 아버님, 오늘은 제가 땅부자 할게요, 호호!"}, "MN003": {"sp": "MN", "text": "자, 세계 여행 출발해 볼까요?"}, "MN004": {"sp": "MN", "text": "좋은 숫자 나와라~"}, "MN005": {"sp": "MN", "text": "호호, 굴려 볼게요!"}, "MN006": {"sp": "MN", "text": "이번엔 어디로 갈까?"}, "MN007": {"sp": "MN", "text": "어머, 더블이에요! 한 번 더~"}, "MN008": {"sp": "MN", "text": "호호, 운이 좋네요!"}, "MN009": {"sp": "MN", "text": "더블! 엄마 한 번 더 간다~"}, "MN010": {"sp": "MN", "text": "어머, 세 번이나요? 무인도는 싫은데!"}, "MN011": {"sp": "MN", "text": "욕심이 과했나 봐요, 호호… 무인도 다녀올게요."}, "MN012": {"sp": "MN", "text": "이 땅 제가 살게요~"}, "MN013": {"sp": "MN", "text": "호호, 좋은 땅이네요!"}, "MN014": {"sp": "MN", "text": "여기 제 거예요!"}, "MN015": {"sp": "MN", "text": "큰맘 먹고 샀어요! 다들 놀러 오세요~"}, "MN016": {"sp": "MN", "text": "이 땅은 꼭 갖고 싶었어요, 호호!"}, "MN017": {"sp": "MN", "text": "통 크게 질렀어요!"}, "MN018": {"sp": "MN", "text": "여긴 다음에 살게요."}, "MN019": {"sp": "MN", "text": "음, 이번엔 참을게요."}, "MN020": {"sp": "MN", "text": "예쁜 집 하나 지었어요~"}, "MN021": {"sp": "MN", "text": "호호, 차근차근 짓는 거죠!"}, "MN022": {"sp": "MN", "text": "여기 우리 집이에요~"}, "MN023": {"sp": "MN", "text": "호텔 완성! 다들 쉬어 가세요, 유료예요~"}, "MN024": {"sp": "MN", "text": "호호, 엄마 호텔 오픈했어요!"}, "MN025": {"sp": "MN", "text": "이 호텔 진짜 예쁘죠? 통행료도 예뻐요~"}, "MN026": {"sp": "MN", "text": "여기 통행료요~"}, "MN027": {"sp": "MN", "text": "아깝지만 드릴게요, 호호."}, "MN028": {"sp": "MN", "text": "네네, 내야죠~"}, "MN029": {"sp": "MN", "text": "어머나, 이렇게 많이요? 엄마 장바구니 다 비었어요!"}, "MN030": {"sp": "MN", "text": "이건 너무 비싸요! 할인 안 될까요?"}, "MN031": {"sp": "MN", "text": "아이고, 생활비가 다 나가네요!"}, "MN032": {"sp": "MN", "text": "어서 오세요~ 통행료는 여기에!"}, "MN033": {"sp": "MN", "text": "감사합니다, 호호!"}, "MN034": {"sp": "MN", "text": "엄마 땅에 잘 오셨어요~"}, "MN035": {"sp": "MN", "text": "어머, 이게 다 제 거예요? 호호호!"}, "MN036": {"sp": "MN", "text": "통행료 감사해요~ 오늘 저녁 반찬 하나 더!"}, "MN037": {"sp": "MN", "text": "죄송해요, 그래도 받을게요~"}, "MN038": {"sp": "MN", "text": "어머, 좋은 거 나왔어요!"}, "MN039": {"sp": "MN", "text": "황금열쇠 최고예요, 호호!"}, "MN040": {"sp": "MN", "text": "오늘 운이 따르네요~"}, "MN041": {"sp": "MN", "text": "어머, 이게 뭐예요!"}, "MN042": {"sp": "MN", "text": "아이고, 돈 나가는 열쇠네요."}, "MN043": {"sp": "MN", "text": "이건 다시 넣으면 안 되나요?"}, "MN044": {"sp": "MN", "text": "여행 가라고요? 좋아요~"}, "MN045": {"sp": "MN", "text": "어디로 가나 볼까요?"}, "MN046": {"sp": "MN", "text": "이건 잘 챙겨 둘게요~"}, "MN047": {"sp": "MN", "text": "호호, 숨겨 둔 카드가 생겼네요."}, "MN048": {"sp": "MN", "text": "반값이라니요, 제일 아끼는 땅인데!"}, "MN049": {"sp": "MN", "text": "어머, 이건 너무 억울해요!"}, "MN050": {"sp": "MN", "text": "세금이 이렇게 많아요? 가계부가 울어요!"}, "MN051": {"sp": "MN", "text": "수리비까지… 집 관리 어렵네요."}, "MN052": {"sp": "MN", "text": "우대권 쓸게요~ 공짜예요!"}, "MN053": {"sp": "MN", "text": "호호, 아껴 둔 보람이 있네요!"}, "MN054": {"sp": "MN", "text": "무인도라니… 잠깐 쉬다 올게요."}, "MN055": {"sp": "MN", "text": "혼자 바다 보며 힐링하고 올게요~"}, "MN056": {"sp": "MN", "text": "어머, 갇혔네요!"}, "MN057": {"sp": "MN", "text": "아직 못 나가요~"}, "MN058": {"sp": "MN", "text": "조금만 더 기다릴게요."}, "MN059": {"sp": "MN", "text": "탈출했어요! 다시 시작해요~"}, "MN060": {"sp": "MN", "text": "드디어 나왔다, 호호!"}, "MN061": {"sp": "MN", "text": "우주여행이에요! 어디로 갈까 고민되네요."}, "MN062": {"sp": "MN", "text": "어머, 로켓이다!"}, "MN063": {"sp": "MN", "text": "출발할게요~ 슝!"}, "MN064": {"sp": "MN", "text": "우주로 날아가요!"}, "MN065": {"sp": "MN", "text": "좋은 곳에 쓰이길 바라요~"}, "MN066": {"sp": "MN", "text": "기부했다고 생각할게요."}, "MN067": {"sp": "MN", "text": "어머, 기금이 제 차지예요!"}, "MN068": {"sp": "MN", "text": "호호, 이게 웬 행운이에요!"}, "MN069": {"sp": "MN", "text": "월급 들어왔어요~"}, "MN070": {"sp": "MN", "text": "한 바퀴 돌았네요, 월급날!"}, "MN071": {"sp": "MN", "text": "돈이 너무 없어요… 조심해야겠어요."}, "MN072": {"sp": "MN", "text": "어쩌죠, 엄마 지갑이 텅텅이에요."}, "MN073": {"sp": "MN", "text": "다음에 걸리면 큰일이에요!"}, "MN074": {"sp": "MN", "text": "아깝지만 팔아야겠어요."}, "MN075": {"sp": "MN", "text": "이 땅이랑 작별이에요…"}, "MN076": {"sp": "MN", "text": "파산했어요… 다들 재밌게 하세요!"}, "MN077": {"sp": "MN", "text": "호호, 졌어요! 다음엔 꼭 이길게요."}, "MN078": {"sp": "MN", "text": "어머, 죄송해요! 그래도 게임이니까요~"}, "MN079": {"sp": "MN", "text": "호호, 제 땅이 좀 무서웠죠?"}, "MN080": {"sp": "MN", "text": "역전이에요! 엄마가 1등!"}, "MN081": {"sp": "MN", "text": "호호, 끝까지 가 봐야 알죠!"}, "MN082": {"sp": "MN", "text": "제가 이겼어요! 다들 고마워요~"}, "MN083": {"sp": "MN", "text": "호호, 숨은 고수가 바로 저예요!"}, "MN084": {"sp": "MN", "text": "우승이에요! 오늘 간식은 제가 살게요!"}, "MN085": {"sp": "MN", "text": "졌네요, 그래도 재밌었어요!"}, "MN086": {"sp": "MN", "text": "다음엔 진짜 안 봐 드려요~"}, "MN087": {"sp": "MN", "text": "아쉽다! 한 판 더 해요!"}, "MN088": {"sp": "MN", "text": "천천히 하세요~"}, "MN089": {"sp": "MN", "text": "누구 차례예요?"}, "MN090": {"sp": "MN", "text": "호호, 고민 오래 하시네요~"}, "MN091": {"sp": "MN", "text": "어서 오세요~ 엄마 땅이에요!"}, "MN092": {"sp": "MN", "text": "이쪽으로 오세요, 호호!"}, "MN093": {"sp": "MN", "text": "어머, 많이 냈네요!"}, "MN094": {"sp": "MN", "text": "아이고, 그거 아프겠다!"}, "MN095": {"sp": "MN", "text": "통행료 보니 제가 다 속상하네요."}, "MN096": {"sp": "MN", "text": "와, 호텔 멋지다! 근데 무섭다~"}, "MN097": {"sp": "MN", "text": "저기는 꼭 피해야겠어요!"}, "MN098": {"sp": "MN", "text": "무인도에서 푹 쉬다 와요~"}, "MN099": {"sp": "MN", "text": "섬에서 조개 좀 주워 와요!"}, "MN100": {"sp": "MN", "text": "어머, 열쇠가 심했다!"}, "MN101": {"sp": "MN", "text": "괜찮아요, 다음엔 좋은 거 나올 거예요."}, "BB001": {"sp": "BB", "text": "확률적으로 제가 이길 것 같은데요?"}, "BB002": {"sp": "BB", "text": "다들 준비되셨죠? 계산은 이미 끝났어요."}, "BB003": {"sp": "BB", "text": "오늘은 전략으로 갑니다."}, "BB004": {"sp": "BB", "text": "일곱이 제일 잘 나와요."}, "BB005": {"sp": "BB", "text": "자, 굴릴게요."}, "BB006": {"sp": "BB", "text": "계산대로 가자."}, "BB007": {"sp": "BB", "text": "더블이네요. 한 번 더 할게요."}, "BB008": {"sp": "BB", "text": "오, 확률 여섯 분의 일 통과!"}, "BB009": {"sp": "BB", "text": "좋아요, 계획에 있던 더블이에요."}, "BB010": {"sp": "BB", "text": "더블 세 번은 계산에 없었는데요…"}, "BB011": {"sp": "BB", "text": "이건 확률의 배신이에요. 무인도 다녀올게요."}, "BB012": {"sp": "BB", "text": "이 땅, 투자 가치 있어요."}, "BB013": {"sp": "BB", "text": "살게요. 수익률 괜찮네요."}, "BB014": {"sp": "BB", "text": "계약할게요."}, "BB015": {"sp": "BB", "text": "비싸지만 회수 가능해요. 삽니다."}, "BB016": {"sp": "BB", "text": "이 땅은 핵심이에요, 놓칠 수 없죠."}, "BB017": {"sp": "BB", "text": "과감하게 투자할게요."}, "BB018": {"sp": "BB", "text": "지금은 현금이 더 중요해요."}, "BB019": {"sp": "BB", "text": "여긴 수익률이 별로예요, 패스."}, "BB020": {"sp": "BB", "text": "건물 하나 올릴게요."}, "BB021": {"sp": "BB", "text": "차근차근 수익 구조 만드는 중이에요."}, "BB022": {"sp": "BB", "text": "이 위치면 회수 금방 해요."}, "BB023": {"sp": "BB", "text": "호텔 완성. 이제 기대 수익이 확 올라가요."}, "BB024": {"sp": "BB", "text": "여기 지나갈 확률 꽤 높은데, 조심하세요."}, "BB025": {"sp": "BB", "text": "계산대로 호텔 지었어요."}, "BB026": {"sp": "BB", "text": "네, 낼게요."}, "BB027": {"sp": "BB", "text": "어쩔 수 없죠, 규칙이니까."}, "BB028": {"sp": "BB", "text": "이 정도는 예상했어요."}, "BB029": {"sp": "BB", "text": "이건… 예상 범위를 넘었어요."}, "BB030": {"sp": "BB", "text": "잠깐만요, 이거 제 자산 절반인데요?"}, "BB031": {"sp": "BB", "text": "계산이 꼬였네요… 많이 아파요."}, "BB032": {"sp": "BB", "text": "통행료 감사합니다."}, "BB033": {"sp": "BB", "text": "투자 회수 중이에요."}, "BB034": {"sp": "BB", "text": "예상대로 오셨네요."}, "BB035": {"sp": "BB", "text": "수익률 최고네요. 감사합니다!"}, "BB036": {"sp": "BB", "text": "이게 바로 장기 투자의 힘이에요."}, "BB037": {"sp": "BB", "text": "오늘의 최대 수익, 감사합니다!"}, "BB038": {"sp": "BB", "text": "좋은 카드네요. 운도 실력이에요."}, "BB039": {"sp": "BB", "text": "오, 이건 유리하네요."}, "BB040": {"sp": "BB", "text": "나쁘지 않네요, 아니 좋네요!"}, "BB041": {"sp": "BB", "text": "이건 변수예요… 계산에 없던."}, "BB042": {"sp": "BB", "text": "아, 손해네요."}, "BB043": {"sp": "BB", "text": "열쇠는 확률 게임이죠, 하아."}, "BB044": {"sp": "BB", "text": "이동이네요. 도착지 계산해 볼게요."}, "BB045": {"sp": "BB", "text": "공짜 이동이면 나쁘지 않아요."}, "BB046": {"sp": "BB", "text": "보험 하나 들었네요."}, "BB047": {"sp": "BB", "text": "이건 결정적일 때 쓸게요."}, "BB048": {"sp": "BB", "text": "반액대매출… 이건 진짜 큰 손실이에요."}, "BB049": {"sp": "BB", "text": "제일 좋은 땅을 반값에요? 너무해."}, "BB050": {"sp": "BB", "text": "건물 많을수록 손해인 카드네요."}, "BB051": {"sp": "BB", "text": "유지비가 꽤 나가네요."}, "BB052": {"sp": "BB", "text": "우대권 쓸게요. 아껴 둔 보람이 있네요."}, "BB053": {"sp": "BB", "text": "지금이 쓸 타이밍이에요."}, "BB054": {"sp": "BB", "text": "무인도… 오히려 쉬면서 통행료 안 내도 되니 괜찮아요."}, "BB055": {"sp": "BB", "text": "잠깐 쉬어 갈게요."}, "BB056": {"sp": "BB", "text": "이것도 전략이라고 생각할게요."}, "BB057": {"sp": "BB", "text": "아직이네요."}, "BB058": {"sp": "BB", "text": "다음 차례에 다시 시도할게요."}, "BB059": {"sp": "BB", "text": "탈출했어요. 다시 계산 시작."}, "BB060": {"sp": "BB", "text": "나왔다. 이제 움직일게요."}, "BB061": {"sp": "BB", "text": "우주여행이네요. 최적의 목적지를 고를게요."}, "BB062": {"sp": "BB", "text": "어디가 기대값이 제일 높을까요?"}, "BB063": {"sp": "BB", "text": "목적지 결정, 출발할게요."}, "BB064": {"sp": "BB", "text": "발사합니다."}, "BB065": {"sp": "BB", "text": "사회 공헌이죠, 뭐."}, "BB066": {"sp": "BB", "text": "기금 냈어요."}, "BB067": {"sp": "BB", "text": "기금 수령! 꽤 쌓여 있었네요."}, "BB068": {"sp": "BB", "text": "이건 순수익이에요."}, "BB069": {"sp": "BB", "text": "월급 들어왔어요."}, "BB070": {"sp": "BB", "text": "한 바퀴 완주, 월급 수령."}, "BB071": {"sp": "BB", "text": "자금이 부족해요… 위험 구간이에요."}, "BB072": {"sp": "BB", "text": "다음에 큰 거 걸리면 끝이에요."}, "BB073": {"sp": "BB", "text": "현금 흐름이 안 좋네요."}, "BB074": {"sp": "BB", "text": "손절할게요. 아깝지만 필요해요."}, "BB075": {"sp": "BB", "text": "자산 정리 들어갑니다."}, "BB076": {"sp": "BB", "text": "파산이네요… 계산 실수였어요."}, "BB077": {"sp": "BB", "text": "졌어요. 다음엔 리스크 관리 더 할게요."}, "BB078": {"sp": "BB", "text": "죄송해요, 계산대로 됐네요."}, "BB079": {"sp": "BB", "text": "게임은 냉정한 거예요."}, "BB080": {"sp": "BB", "text": "역전했어요. 계산대로예요."}, "BB081": {"sp": "BB", "text": "이제 제가 1등이에요."}, "BB082": {"sp": "BB", "text": "예상대로 제가 이겼네요. 수고하셨어요!"}, "BB083": {"sp": "BB", "text": "전략 승리예요! 다들 재밌었어요."}, "BB084": {"sp": "BB", "text": "이겼다! 사실 좀 떨렸어요."}, "BB085": {"sp": "BB", "text": "졌네요… 다음엔 변수까지 계산할게요."}, "BB086": {"sp": "BB", "text": "아쉽지만 인정할게요."}, "BB087": {"sp": "BB", "text": "이번 판 데이터로 다음엔 이겨요."}, "BB088": {"sp": "BB", "text": "천천히 생각하셔도 돼요."}, "BB089": {"sp": "BB", "text": "다음 차례 계산 중이에요."}, "BB090": {"sp": "BB", "text": "주사위는 생각보다 공정해요."}, "BB091": {"sp": "BB", "text": "이쪽 확률 꽤 높아요. 어서 오세요."}, "BB092": {"sp": "BB", "text": "여기 걸릴 확률, 육분의 일이에요."}, "BB093": {"sp": "BB", "text": "와, 저건 손실이 크네요."}, "BB094": {"sp": "BB", "text": "거기 걸릴 확률 낮았는데…"}, "BB095": {"sp": "BB", "text": "통행료 금액 보니 아찔하네요."}, "BB096": {"sp": "BB", "text": "저 호텔은 피해야 할 구간이에요."}, "BB097": {"sp": "BB", "text": "투자 제대로 하셨네요."}, "BB098": {"sp": "BB", "text": "무인도도 나름 안전지대예요."}, "BB099": {"sp": "BB", "text": "푹 쉬다 오세요."}, "BB100": {"sp": "BB", "text": "아, 운이 없으셨네요."}, "BB101": {"sp": "BB", "text": "열쇠는 랜덤이니까요."}, "GY001": {"sp": "GY", "text": "우와, 부루마블이다! 저 이거 완전 잘해요!"}, "GY002": {"sp": "GY", "text": "다들 각오하세요~ 보경이 나가신다!"}, "GY003": {"sp": "GY", "text": "헐, 가족 다 모였네? 대박 재밌겠다!"}, "GY004": {"sp": "GY", "text": "제발 좋은 거 나와라~ 제발!"}, "GY005": {"sp": "GY", "text": "굴린다아~"}, "GY006": {"sp": "GY", "text": "주사위야 보경이 좀 봐줘!"}, "GY007": {"sp": "GY", "text": "대박, 더블! 또 굴려요!"}, "GY008": {"sp": "GY", "text": "헐, 쌍둥이 숫자다! 한 번 더~"}, "GY009": {"sp": "GY", "text": "더블 나왔어요! 저 천재인가 봐요!"}, "GY010": {"sp": "GY", "text": "헐, 세 번이나? 왜 하필 무인도야!"}, "GY011": {"sp": "GY", "text": "말도 안 돼! 더블이 너무 많아도 벌이에요?"}, "GY012": {"sp": "GY", "text": "이 땅 제가 찜했어요!"}, "GY013": {"sp": "GY", "text": "완전 예쁜 땅! 살래요!"}, "GY014": {"sp": "GY", "text": "헤헤, 이제 여기 보경이 땅!"}, "GY015": {"sp": "GY", "text": "대박, 저 엄청 비싼 땅 샀어요!"}, "GY016": {"sp": "GY", "text": "이 땅 사려고 용돈 다 썼어요!"}, "GY017": {"sp": "GY", "text": "이제 여기 지나가면 다들 내 거예요!"}, "GY018": {"sp": "GY", "text": "음… 여긴 별로예요, 패스!"}, "GY019": {"sp": "GY", "text": "여긴 안 살래요, 돈 아껴야지~"}, "GY020": {"sp": "GY", "text": "집 지었어요! 완전 귀엽다!"}, "GY021": {"sp": "GY", "text": "헤헤, 보경이 동네 만들기!"}, "GY022": {"sp": "GY", "text": "건물 올렸어요~ 예쁘죠?"}, "GY023": {"sp": "GY", "text": "대박! 호텔이에요, 호텔!"}, "GY024": {"sp": "GY", "text": "보경 호텔 오픈! 다들 놀러 와요, 돈 내고!"}, "GY025": {"sp": "GY", "text": "헐, 이 호텔 완전 반짝반짝해요!"}, "GY026": {"sp": "GY", "text": "히잉, 통행료 낼게요…"}, "GY027": {"sp": "GY", "text": "에이, 아까워요~"}, "GY028": {"sp": "GY", "text": "다음엔 제가 받을 거예요!"}, "GY029": {"sp": "GY", "text": "헐, 이게 다 통행료예요? 말도 안 돼!"}, "GY030": {"sp": "GY", "text": "으아악, 제 용돈 다 날아갔어요!"}, "GY031": {"sp": "GY", "text": "이건 너무해요! 조금만 깎아 주세요, 네?"}, "GY032": {"sp": "GY", "text": "헤헤, 어서 오세요~ 통행료 주세요!"}, "GY033": {"sp": "GY", "text": "앗싸, 돈 들어왔다!"}, "GY034": {"sp": "GY", "text": "보경이 땅에 온 걸 환영해요~"}, "GY035": {"sp": "GY", "text": "대박 대박! 저 부자 됐어요!"}, "GY036": {"sp": "GY", "text": "헐, 이렇게 많이요? 완전 신나!"}, "GY037": {"sp": "GY", "text": "죄송해요~ 근데 너무 좋아요!"}, "GY038": {"sp": "GY", "text": "대박, 완전 좋은 거 나왔어요!"}, "GY039": {"sp": "GY", "text": "헤헤, 황금열쇠 사랑해요!"}, "GY040": {"sp": "GY", "text": "오예, 운 좋다!"}, "GY041": {"sp": "GY", "text": "헐, 이게 뭐야!"}, "GY042": {"sp": "GY", "text": "히잉, 열쇠가 나를 싫어해요!"}, "GY043": {"sp": "GY", "text": "말도 안 돼, 돈 나가잖아요!"}, "GY044": {"sp": "GY", "text": "어디 가래요? 여행이다~"}, "GY045": {"sp": "GY", "text": "우와, 공짜 여행! 신난다!"}, "GY046": {"sp": "GY", "text": "이건 제 비밀 무기예요, 헤헤!"}, "GY047": {"sp": "GY", "text": "이거 잘 숨겨 둬야지~"}, "GY048": {"sp": "GY", "text": "헐, 반값이요? 제 땅 돌려줘요!"}, "GY049": {"sp": "GY", "text": "말도 안 돼, 제일 좋은 땅인데!"}, "GY050": {"sp": "GY", "text": "세금이라니, 너무해요!"}, "GY051": {"sp": "GY", "text": "건물 많은 게 죄예요?"}, "GY052": {"sp": "GY", "text": "우대권 쓸래요! 공짜예요, 헤헤!"}, "GY053": {"sp": "GY", "text": "이럴 때 쓰라고 있는 거죠?"}, "GY054": {"sp": "GY", "text": "헐, 무인도? 심심해서 어떡해!"}, "GY055": {"sp": "GY", "text": "여기서 혼자 뭐 해요, 히잉!"}, "GY056": {"sp": "GY", "text": "구해 주세요~"}, "GY057": {"sp": "GY", "text": "아직도 못 나가요, 히잉!"}, "GY058": {"sp": "GY", "text": "더블 제발요~"}, "GY059": {"sp": "GY", "text": "탈출 성공! 보고 싶었죠?"}, "GY060": {"sp": "GY", "text": "드디어 나왔어요! 자유다!"}, "GY061": {"sp": "GY", "text": "우주여행이다! 완전 신나!"}, "GY062": {"sp": "GY", "text": "헐, 로켓 탄다! 사진 찍어야지!"}, "GY063": {"sp": "GY", "text": "슝~ 보경이 날아가요!"}, "GY064": {"sp": "GY", "text": "우주로 출발! 꺄!"}, "GY065": {"sp": "GY", "text": "기부했어요, 착하죠?"}, "GY066": {"sp": "GY", "text": "히잉, 아깝지만 좋은 데 쓰겠죠?"}, "GY067": {"sp": "GY", "text": "대박, 기금 다 제 거예요?"}, "GY068": {"sp": "GY", "text": "헤헤, 공짜 돈이다!"}, "GY069": {"sp": "GY", "text": "월급이다! 용돈 들어왔어요~"}, "GY070": {"sp": "GY", "text": "한 바퀴 돌았더니 돈 생겼어요!"}, "GY071": {"sp": "GY", "text": "헐, 저 돈 거의 없어요…"}, "GY072": {"sp": "GY", "text": "어떡해, 무서워요!"}, "GY073": {"sp": "GY", "text": "다음에 걸리면 저 진짜 끝이에요…"}, "GY074": {"sp": "GY", "text": "히잉, 이 땅 팔아야 돼요…"}, "GY075": {"sp": "GY", 014": {"sp": "AE", "text": "여기 예쁘다, 살게요!"}, "AE015": {"sp": "AE", "text": "우와, 엄청 비싼 땅 샀어요! 히히!"}, "AE016": {"sp": "AE", "text": "이 땅은 보애 거예요~ 다들 조심해요!"}, "AE017": {"sp": "AE", "text": "큰맘 먹고 샀어요!"}, "AE018": {"sp": "AE", "text": "여긴 다음에 살래요, 히히."}, "AE019": {"sp": "AE", "text": "음… 패스할게요~"}, "AE020": {"sp": "AE", "text": "집 지었어요, 히히!"}, "AE021": {"sp": "AE", "text": "짜잔, 보애네 집이에요~"}, "AE022": {"sp": "AE", "text": "건물 하나 뚝딱!"}, "AE023": {"sp": "AE", "text": "우와, 호텔이다! 보애 호텔 오픈!"}, "AE024": {"sp": "AE", "text": "히히, 반짝반짝 호텔 지었어요!"}, "AE025": {"sp": "AE", "text": "이제 여기 오면 통행료 많이 내야 해요~"}, "AE026": {"sp": "AE", "text": "통행료 드릴게요, 히히."}, "AE027": {"sp": "AE", "text": "에이, 아깝다~"}, "AE028": {"sp": "AE", "text": "다음엔 보애가 받을 거예요!"}, "AE029": {"sp": "AE", "text": "으앙, 너무 많아요! 보애 돈 다 날아갔어요!"}, "AE030": {"sp": "AE", "text": "히잉, 이건 너무 비싸요~"}, "AE031": {"sp": "AE", "text": "어? 이렇게나 많이요? 흑흑!"}, "AE032": {"sp": "AE", "text": "히히, 통행료 감사해요~"}, "AE033": {"sp": "AE", "text": "어서 오세요~ 보애 땅이에요!"}, "AE034": {"sp": "AE", "text": "앗싸, 돈 들어왔다!"}, "AE035": {"sp": "AE", "text": "우와, 대박! 보애 부자 됐어요!"}, "AE036": {"sp": "AE", "text": "히히, 이렇게 많이요? 고마워요~"}, "AE037": {"sp": "AE", "text": "미안해요~ 근데 너무 좋아요, 히히!"}, "AE038": {"sp": "AE", "text": "히히, 좋은 거 나왔다!"}, "AE039": {"sp": "AE", "text": "우와, 황금열쇠 최고!"}, "AE040": {"sp": "AE", "text": "오늘 보애 운 좋다~"}, "AE041": {"sp": "AE", "text": "히잉, 이게 뭐야~"}, "AE042": {"sp": "AE", "text": "에이, 돈 나간다…"}, "AE043": {"sp": "AE", "text": "열쇠가 장난쳐요, 히잉!"}, "AE044": {"sp": "AE", "text": "여행 가요? 신난다~"}, "AE045": {"sp": "AE", "text": "어디로 가는 거예요? 히히!"}, "AE046": {"sp": "AE", "text": "이거 보애가 잘 갖고 있을게요~"}, "AE047": {"sp": "AE", "text": "히히, 비밀 카드 생겼다!"}, "AE048": {"sp": "AE", "text": "히잉, 내 땅 반값이래요…"}, "AE049": {"sp": "AE", "text": "으앙, 제일 좋은 땅이었는데!"}, "AE050": {"sp": "AE", "text": "세금이요? 히잉, 낼게요."}, "AE051": {"sp": "AE", "text": "집이 많아서 돈이 나가요~"}, "AE052": {"sp": "AE", "text": "우대권 쓸래요! 히히, 공짜!"}, "AE053": {"sp": "AE", "text": "짠! 우대권이에요~"}, "AE054": {"sp": "AE", "text": "무인도에 갇혔어요, 히잉~"}, "AE055": {"sp": "AE", "text": "보애 섬에서 쉬고 있을게요!"}, "AE056": {"sp": "AE", "text": "혼자 심심하겠다~"}, "AE057": {"sp": "AE", "text": "아직 못 나가요~"}, "AE058": {"sp": "AE", "text": "히잉, 더블 나와라~"}, "AE059": {"sp": "AE", "text": "탈출했다! 히히!"}, "AE060": {"sp": "AE", "text": "보애 돌아왔어요~"}, "AE061": {"sp": "AE", "text": "우와, 우주여행이다! 히히!"}, "AE062": {"sp": "AE", "text": "로켓 타요? 신난다~"}, "AE063": {"sp": "AE", "text": "슝~ 보애 날아가요!"}, "AE064": {"sp": "AE", "text": "우주로 출발~ 히히!"}, "AE065": {"sp": "AE", "text": "좋은 데 써 주세요~"}, "AE066": {"sp": "AE", "text": "기부했어요, 히히."}, "AE067": {"sp": "AE", "text": "우와, 기금 받았어요!"}, "AE068": {"sp": "AE", "text": "히히, 공짜 돈이다~"}, "AE069": {"sp": "AE", "text": "월급이다! 히히~"}, "AE070": {"sp": "AE", "text": "한 바퀴 돌았어요, 돈 받았다!"}, "AE071": {"sp": "AE", "text": "히잉, 돈이 별로 없어요…"}, "AE072": {"sp": "AE", "text": "어떡해요, 무서워요~"}, "AE073": {"sp": "AE", "text": "다음엔 안 걸려야 할 텐데…"}, "AE074": {"sp": "AE", "text": "히잉, 땅 팔게요…"}, "AE075": {"sp": "AE", "text": "아깝다, 그래도 팔아야지~"}, "AE076": {"sp": "AE", "text": "으앙, 보애 파산했어요! 그래도 재밌었어요~"}, "AE077": {"sp": "AE", "text": "히잉, 졌다! 다음 판에 또 해요!"}, "AE078": {"sp": "AE", "text": "어? 보애가 이겼어요? 미안해요, 히히!"}, "AE079": {"sp": "AE", "text": "히히, 보애 땅이 좀 셌나 봐요~"}, "AE080": {"sp": "AE", "text": "히히, 보애가 1등이에요!"}, "AE081": {"sp": "AE", "text": "역전이다! 신난다~"}, "AE082": {"sp": "AE", "text": "우와, 보애가 이겼어요! 다들 고마워요!"}, "AE083": {"sp": "AE", "text": "히히, 우승이다! 너무 좋아요~"}, "AE084": {"sp": "AE", "text": "이겼다~! 한 판 더 해요!"}, "AE085": {"sp": "AE", "text": "졌다~ 그래도 재밌었어요, 히히!"}, "AE086": {"sp": "AE", "text": "으앙, 아쉽다! 다음엔 이길래요!"}, "AE087": {"sp": "AE", "text": "다들 축하해요~ 히히!"}, "AE088": {"sp": "AE", "text": "히히, 기다리고 있어요~"}, "AE089": {"sp": "AE", "text": "빨리 굴려요~"}, "AE090": {"sp": "AE", "text": "누구 차례예요? 히히."}, "AE091": {"sp": "AE", "text": "이쪽으로 오세요~ 히히!"}, "AE092": {"sp": "AE", "text": "보애 땅으로 와요~"}, "AE093": {"sp": "AE", "text": "우와, 많이 냈다!"}, "AE094": {"sp": "AE", "text": "히잉, 아프겠다~"}, "AE095": {"sp": "AE", "text": "통행료 엄청 비싸다!"}, "AE096": {"sp": "AE", "text": "우와, 호텔 멋지다!"}, "AE097": {"sp": "AE", "text": "저기는 피해 가야지, 히히!"}, "AE098": {"sp": "AE", "text": "무인도 잘 다녀와요~"}, "AE099": {"sp": "AE", "text": "히히, 섬에서 쉬다 와요!"}, "AE100": {"sp": "AE", "text": "아이고, 열쇠 운이 없다~"}, "AE101": {"sp": "AE", "text": "괜찮아요, 히히!"}, "SK001": {"sp": "SK", "text": "오늘 우승은 무조건 보석이다!"}, "SK002": {"sp": "SK", "text": "다 덤벼! 보석이가 다 이겨 줄게!"}, "SK003": {"sp": "SK", "text": "레츠 고! 부루마블 시작!"}, "SK004": {"sp": "SK", "text": "간다! 열두 나와라!"}, "SK005": {"sp": "SK", "text": "얍! 받아라!"}, "SK006": {"sp": "SK", "text": "주사위 던지기 장인 나가신다!"}, "SK007": {"sp": "SK", "text": "더블! 크으, 이게 실력이지!"}, "SK008": {"sp": "SK", "text": "앗싸, 한 번 더!"}, "SK009": {"sp": "SK", "text": "봤어? 더블이야, 더블!"}, "SK010": {"sp": "SK", "text": "뭐야, 세 번이나? 이건 사기야!"}, "SK011": {"sp": "SK", "text": "아 진짜! 더블 세 번은 반칙이잖아!"}, "SK012": {"sp": "SK", "text": "이 땅 보석이 거!"}, "SK013": {"sp": "SK", "text": "앗싸, 득템!"}, "SK014": {"sp": "SK", "text": "여기 내가 접수한다!"}, "SK015": {"sp": "SK", "text": "비싼 땅 샀다! 이제 다 내 밥이야!"}, "SK016": {"sp": "SK", "text": "레전드 땅 득템! 다들 조심해!"}, "SK017": {"sp": "SK", "text": "올인했다! 이 땅이면 끝이야!"}, "SK018": {"sp": "SK", "text": "여긴 노노, 패스!"}, "SK019": {"sp": "SK", "text": "이 땅은 별로야, 안 사!"}, "SK020": {"sp": "SK", "text": "건물 올린다! 쾅쾅!"}, "SK021": {"sp": "SK", "text": "보석 건설 출동!"}, "SK022": {"sp": "SK", "text": "하나 더 짓자!"}, "SK023": {"sp": "SK", "text": "호텔 완성! 여기 걸리면 끝장이야!"}, "SK024": {"sp": "SK", "text": "레전드 호텔 탄생! 크하하!"}, "SK025": {"sp": "SK", "text": "보석 호텔, 입장료 비쌉니다!"}, "SK026": {"sp": "SK", "text": "쳇, 통행료 여기!"}, "SK027": {"sp": "SK", "text": "에이, 다음엔 내가 받는다!"}, "SK028": {"sp": "SK", "text": "아까워! 그래도 낸다."}, "SK029": {"sp": "SK", "text": "으아악! 내 돈! 내 돈!"}, "SK030": {"sp": "SK", "text": "이건 사기야! 너무 비싸!"}, "SK031": {"sp": "SK", "text": "말도 안 돼, 거의 다 털렸어!"}, "SK032": {"sp": "SK", "text": "크크, 통행료 내놔!"}, "SK033": {"sp": "SK", "text": "앗싸, 돈 들어왔다!"}, "SK034": {"sp": "SK", "text": "보석이 땅 밟았지? 계산해!"}, "SK035": {"sp": "SK", "text": "대박! 이거 다 내 거야? 크하하!"}, "SK036": {"sp": // ---------- 규칙 ----------
const DEFAULT_RULES={
  startMoney:m(293), salary:m(20), fundFee:m(15), spaceFee:m(20),
  buildWhen:'land',      // land: 내 땅에 도착했을 때 / any: 내 차례에 아무 내 땅

  sellRate:1,            // 은행 매각: 1=산 값 그대로(원작), 0.5=반값
  endMode:'last',        // last: 마지막 한 명 / laps: 정해진 바퀴 후 총자산
  laps:20,
  islandTurns:3,

};

// ---------- 난수 ----------
function rnd(s){ // xorshift32
  let x=s.rng|0; if(!x)x=0x9e3779b9; x^=x<<13; x^=x>>>17; x^=x<<5; s.rng=x|0; return ((x>>>0)%1000000)/1000000; }
function rint(s,n){ return Math.floor(rnd(s)*n); }
function shuffle(s,a){ for(let i=a.length-1;i>0;i--){ const j=rint(s,i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// ---------- 상태 생성 ----------
// seats: [{ch,name,kind:'human'|'ai',uid?,dev?}]
function newGame(opt){
  const rules=Object.assign({},DEFAULT_RULES,opt.rules||{});
  const s={v:1,board:opt.board==='korea'?'korea':'world',rules,rng:(opt.seed>>>0)||((Date.now()*2654435761)>>>0)||1,
    players:[],owner:new Array(40).fill(-1),bld:new Array(40).fill(null).map(()=>({v:0,b:0,h:0})),
    fund:0,bankNet:0,deck:[],discard:[],turn:0,round:1,turnNo:0,dbl:0,phase:'start',pend:null,ops:[],ev:[],evId:0,
    winner:-1,over:false,order:[],created:opt.now||0,lastDice:null,lastCard:null};
  const seats=opt.seats.slice(0,8);
  seats.forEach((st,i)=>s.players.push({i,ch:st.ch,name:st.name||st.ch,kind:st.kind||'ai',uid:st.uid||null,dev:st.dev||null,
    money:rules.startMoney,pos:0,alive:true,out:null,rank:0,island:0,space:0,keys:{escape:0,pass:0},laps:0,
    st:{toll:0,tollRecv:0,maxToll:0,maxTollRecv:0,built:0,hotels:0,keys:0,goodKeys:0,islands:0,ruined:0,maxAsset:rules.startMoney,buys:0,spaceTrips:0,dbls:0}}));
  s.deck=shuffle(s,CARDS.map((c,i)=>i));
  // 순서 정하기: 주사위 대신 무작위 섞기 (화면에서는 주사위 연출)
  const order=shuffle(s,s.players.map(p=>p.i));
  if(opt.keepOrder) order.sort((a,b)=>a-b);
  s.order=order; s.turn=order[0];
  ev(s,{t:'order',order});
  s.ops=[{op:'turnStart'}];
  run(s);
  return s;
}
function ev(s,e){ e.id=++s.evId; s.ev.push(e); if(s.ev.length>400)s.ev.splice(0,s.ev.length-400); return e; }
const P=(s,i)=>s.players[i];
const alive=s=>s.players.filter(p=>p.alive);
function landValue(s,c){ const cell=boardOf(s)[c]; let v=cell.price; const b=s.bld[c]; if(cell.cost){ v+=b.v*cell.cost.v+b.b*cell.cost.b+b.h*cell.cost.h; } return v; }
function assets(s,i){ let a=P(s,i).money; for(let c=0;c<40;c++) if(s.owner[c]===i) a+=landValue(s,c); return a; }
function sellValue(s,i){ let a=0; for(let c=0;c<40;c++) if(s.owner[c]===i) a+=Math.floor(landValue(s,c)*s.rules.sellRate); return a; }
function toll(s,c){ const cell=boardOf(s)[c]; if(s.owner[c]<0)return 0; let t=cell.toll.land; const b=s.bld[c]; if(cell.t==='city'){ if(b.v===1)t+=cell.toll.v1; if(b.v===2)t+=cell.toll.v2; if(b.b)t+=cell.toll.b; if(b.h)t+=cell.toll.h; } return t; }
function buildingCount(s,i){ const r={v:0,b:0,h:0}; for(let c=0;c<40;c++) if(s.owner[c]===i){ const b=s.bld[c]; r.v+=b.v; r.b+=b.b; r.h+=b.h; } return r; }
function buildOptions(s,i,c){ // 지을 수 있는 것
  const cell=boardOf(s)[c]; if(cell.t!=='city'||s.owner[c]!==i)return null; const b=s.bld[c];
  return {v:2-b.v,b:1-b.b,h:1-b.h,cost:cell.cost};
}
function canBuildAny(s,i,c){ const o=buildOptions(s,i,c); if(!o)return false; const mo=P(s,i).money; return (o.v>0&&mo>=o.cost.v)||(o.b>0&&mo>=o.cost.b)||(o.h>0&&mo>=o.cost.h); }

// ---------- 돈 ----------
function give(s,i,amt,why){ if(amt<=0)return; P(s,i).money+=amt; s.bankNet+=amt; }
function take(s,i,amt){ P(s,i).money-=amt; s.bankNet-=amt; }
function xfer(s,from,to,amt){ P(s,from).money-=amt; P(s,to).money+=amt; }
function trackAsset(s){ for(const p of s.players) if(p.alive){ const a=assets(s,p.i); if(a>p.st.maxAsset)p.st.maxAsset=a; } }

// ---------- 실행기 ----------
function cur(s){ return P(s,s.turn); }
function decide(s,phase,pend){ s.phase=phase; s.pend=Object.assign({p:s.turn},pend||{}); return true; }
function run(s){
  let guard=0;
  while(!s.over && s.ops.length && !(s.pend)){
    if(++guard>5000) throw new Error('op loop');
    const o=s.ops.shift();
    exec(s,o);
  }
  trackAsset(s);
  checkOver(s);
  return s;
}
function push(s,...ops){ s.ops.unshift(...ops); }
function exec(s,o){
  const p=cur(s);
  switch(o.op){
  case 'turnStart':{
    if(!p.alive){ push(s,{op:'nextTurn'}); return; }
    s.dbl=0; s.turnNo++;
    ev(s,{t:'turn',p:p.i,turnNo:s.turnNo,round:s.round});
    if(p.space){ decide(s,'space',{free:p.space===2}); return; }
    if(p.island>0){ decide(s,'island',{left:p.island,canEscape:p.keys.escape>0}); return; }
    decide(s,'roll',{}); return;
  }
  case 'roll': { decide(s,'roll',{again:true}); return; }
  case 'moveBy':{ moveSteps(s,p,o.n,o.salary!==false); return; }
  case 'moveTo':{ // 앞으로 이동
    let n=(o.to-p.pos+40)%40; if(n===0&&o.full)n=40; if(n===0){ push(s,{op:'land'}); return; }
    moveSteps(s,p,n,o.salary!==false,o.fundPass); return; }
  case 'back':{ const path=[]; for(let k=1;k<=o.n;k++){ path.push((p.pos-k+40)%40); } p.pos=path[path.length-1]; ev(s,{t:'move',p:p.i,path,back:1}); push(s,{op:'land'}); return; }
  case 'teleport':{ p.pos=o.to; ev(s,{t:'jump',p:p.i,to:o.to,why:o.why||''}); return; }
  case 'land': return land(s,p,o);
  case 'pay': return payOp(s,o);
  case 'afterLand':{ // 더블이면 한 번 더
    if(!p.alive){ push(s,{op:'nextTurn'}); return; }
    if(s.lastDbl && !p.island && !p.space){ s.lastDbl=false; ev(s,{t:'again',p:p.i}); push(s,{op:'roll'}); return; }
    s.lastDbl=false; push(s,{op:'endTurn'}); return; }
  case 'endTurn':{ push(s,{op:'nextTurn'}); return; }
  case 'nextTurn':{
    const al=s.order.filter(i=>P(s,i).alive); if(al.length<=1){ checkOver(s); return; }
    const idx=s.order.indexOf(s.turn), L=s.order.length; let nx=-1, wrapped=false;
    for(let k=1;k<=L;k++){ const j=(idx+k)%L; if(P(s,s.order[j]).alive){ nx=s.order[j]; wrapped=idx+k>=L; break; } }
    if(wrapped){ s.round++; ev(s,{t:'round',round:s.round}); if(s.rules.endMode==='laps' && s.round>s.rules.laps){ finishByAssets(s); return; } }
    s.turn=nx; push(s,{op:'turnStart'}); return; }
  case 'buyOffer':{ const cell=boardOf(s)[o.c]; if(s.owner[o.c]>=0)return; if(p.money<cell.price){ ev(s,{t:'cantBuy',p:p.i,c:o.c}); return; } decide(s,'buy',{c:o.c,price:cell.price}); return; }
  case 'buildOffer':{ if(canBuildAny(s,p.i,o.c)) decide(s,'build',{c:o.c,first:!!o.first}); return; }
  case 'passOffer':{ decide(s,'pass',{c:o.c,amt:o.amt,to:o.to}); return; }
  case 'card': return drawCard(s,p);
  case 'cardFx': return cardFx(s,p,o);

function moveSteps(s,p,n,salary,fundPass){

  p.pos=pos; ev(s,{t:'move',p:p.i,path});

  if(passedFund && fundPass){ after.push({op:'fundCollect'}); }

function goIsland(s,p,why){ p.pos=POS.island; p.island=s.rules.islandTurns; p.st.islands++; s.lastDbl=false; ev(s,{t:'island',p:p.i,why}); }
function land(s,p,o){
  const c=p.pos, cell=boardOf(s)[c];

  switch(cell.t){
  case 'start': return;
  case 'island': goIsland(s,p,'land'); return;
  case 'key': push(s,{op:'card'}); return;
  case 'fundIn': push(s,{op:'fundCollect'}); return;
  case 'fundOut': push(s,{op:'pay',from:p.i,to:'fund',amt:s.rules.fundFee,why:'fund'}); return;
  case 'space': push(s,{op:'spaceSet'}); return;
  case 'city': case 'spot':{
    const ow=s.owner[c];
    if(ow<0){ push(s,{op:'buyOffer',c}); return; }
    if(ow===p.i){ if(cell.t==='city' && s.rules.buildWhen==='land') push(s,{op:'buildOffer',c}); return; }
    const t=toll(s,c);
    if(p.keys.pass>0){ push(s,{op:'passOffer',c,amt:t,to:ow}); return; }

}
// 지불: 모자라면 매각(사람은 직접, 컴퓨터·자동은 알아서), 그래도 모자라면 파산
function payOp(s,o){
  const p=P(s,o.from);
  if(!p.alive)return;
  if(o.amt<=0){ return; }
  if(p.money>=o.amt){ settle(s,o); return; }
  const can=p.money+sellValue(s,p.i);
  if(can<o.amt){ bankrupt(s,p.i,o); return; }
  if(o.auto || p.i!==s.turn){ autoSell(s,p.i,o.amt); settle(s,o); return; }

}
function settle(s,o){

  if(to==='bank' || to==null || (typeof to==='number' && !P(s,to).alive)){ take(s,p.i,o.amt); ev(s,{t:'pay',p:p.i,to:'bank',amt:o.amt,why:o.why,c:o.c}); return; }
