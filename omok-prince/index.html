<style>
:root{--cs:24px;--pad:10px;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px)}
body.princess{
  --ink:#5a4470;--accent:#ff7fae;--accent2:#ffb6d0;--soft:#fff3f9;--soft2:#f6e9ff;--card:rgba(255,255,255,.88);--cardB:#ffd3e6;--btn:#ff8fb7;--btnInk:#fff;--btn2:#e6dcff;--btn2Ink:#6a4f9c;
  --boardA:#ffeec2;--boardB:#ffdfa3;--frame:#ffbfd9;--frameB:#ff9cc3;--line:#cf9f66;--hoshi:#b97d3e;--mark:#ff5c93;--okc:#58c79a;--gold:#ffd25a;--hint:#ff5c93;
  --bgcss:radial-gradient(120% 60% at 15% 0%,rgba(255,255,255,.75),transparent 60%),radial-gradient(90% 60% at 100% 30%,rgba(255,214,236,.8),transparent 70%),linear-gradient(180deg,#cfe9ff 0%,#e9e0ff 42%,#ffe0ef 78%,#ffeaf3 100%);
  --bubble:#fff;--bubbleInk:#5a4470;--h1:#ff7fae;--sub:#8c76b3;--win:#ff7fae}
body.prince{
  --ink:#d6e4f5;--accent:#f0c14b;--accent2:#ffd978;--soft:#12294a;--soft2:#0f2340;--card:rgba(16,36,68,.88);--cardB:#2c4a7e;--btn:#e2b13c;--btnInk:#1a1f33;--btn2:#1d3a68;--btn2Ink:#cfe0f8;
  --boardA:#24467a;--boardB:#1a3562;--frame:#d9b252;--frameB:#a8802a;--line:#c9a74f;--hoshi:#f0c14b;--mark:#3de0c0;--okc:#2dd4a8;--gold:#f0c14b;--hint:#3de0c0;
  --bgcss:radial-gradient(80% 50% at 20% 10%,rgba(61,139,253,.25),transparent 55%),radial-gradient(70% 45% at 90% 20%,rgba(45,212,168,.18),transparent 60%),radial-gradient(50% 40% at 50% 80%,rgba(240,193,75,.08),transparent 70%),linear-gradient(180deg,#071428 0%,#0d2040 35%,#12305a 70%,#0a2a3a 100%);
  --bubble:#16315c;--bubbleInk:#e8f0ff;--h1:#f0c14b;--sub:#8fb0dc;--win:#f0c14b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:#071428}
body{margin:0;min-height:100dvh;color:var(--ink);word-break:keep-all;overflow-wrap:break-word;touch-action:manipulation;-webkit-user-select:none;user-select:none;overscroll-behavior:none;
  font-family:ui-rounded,"SF Pro Rounded","NanumSquareRound","NanumSquare Round","나눔스퀘어라운드","Hiragino Maru Gothic ProN","Arial Rounded MT Bold","Varela Round","Apple SD Gothic Neo","Malgun Gothic","Nanum Gothic",system-ui,sans-serif}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:var(--bgcss)}
#bg .tw{position:absolute;animation:tw 3.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.3;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(20deg)}}
#app{position:relative;z-index:1;min-height:100dvh;padding:calc(10px + var(--safe-t)) calc(14px + var(--safe-r)) calc(18px + var(--safe-b)) calc(14px + var(--safe-l));display:flex;flex-direction:column;align-items:center}
header{text-align:center;margin-bottom:8px}
h1{margin:0;font-size:clamp(22px,4vw,36px);line-height:1.15;color:var(--h1);font-weight:800;letter-spacing:.5px}
body.princess h1{text-shadow:0 2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,0 -2px 0 #fff,2px 2px 0 #fff,-2px 2px 0 #fff,0 5px 0 rgba(255,127,174,.25)}
body.prince h1{text-shadow:0 2px 0 #00122e,0 0 18px rgba(240,193,75,.35)}
.sub{margin:2px 0 0;font-size:14px;color:var(--sub)}
.grid{display:grid;gap:14px;align-items:start;justify-items:center;width:100%;max-width:1240px;justify-content:center}
body[data-layout=row] .grid{grid-template-columns:auto 400px;align-items:stretch}
body[data-layout=col] .grid{grid-template-columns:minmax(0,1fr)}
.boardArea{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px}
.frame{padding:var(--pad);border-radius:26px;background:linear-gradient(145deg,var(--frame),var(--frameB));box-shadow:0 10px 26px rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.55)}
#board{position:relative;width:calc(var(--cs)*15);height:calc(var(--cs)*15);border-radius:14px;background:linear-gradient(145deg,var(--boardA),var(--boardB));box-shadow:inset 0 3px 10px rgba(0,0,0,.18);touch-action:manipulation;cursor:pointer}
#board svg.lay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#stones,#marks{position:absolute;inset:0;pointer-events:none}
.stone{position:absolute;width:calc(var(--cs)*1.2);height:calc(var(--cs)*1.2);left:calc((var(--x) - .1)*var(--cs));top:calc((var(--y) - .196)*var(--cs));z-index:calc(var(--y) + 1);transform-origin:50% 80%;pointer-events:none}
.stone svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 1.5px 1.5px rgba(0,0,0,.28))}
.stone.drop{animation:pop .62s cubic-bezier(.3,.7,.4,1) both}
@keyframes pop{0%{transform:translateY(calc(var(--cs)*-1.5)) scale(.6,1.35);opacity:0}
 38%{transform:translateY(0) scale(1.38,.62);opacity:1}
 56%{transform:translateY(calc(var(--cs)*-.42)) scale(.86,1.16)}
 74%{transform:translateY(0) scale(1.14,.88)}
 88%{transform:translateY(calc(var(--cs)*-.08)) scale(.98,1.03)}
 100%{transform:none}}
.stone.win{animation:dance .9s ease-in-out infinite;animation-delay:calc(var(--k)*90ms);z-index:200}
.stone.win svg{filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 10px var(--gold)) drop-shadow(0 0 16px var(--gold))}
.stone.dim{opacity:.5;transition:opacity .5s}
@keyframes dance{0%,100%{transform:translateY(0) rotate(0) scale(1.08)}20%{transform:translateY(calc(var(--cs)*-.55)) rotate(-14deg) scale(1.2)}
 45%{transform:translateY(0) rotate(0) scale(1.22,.86)}70%{transform:translateY(calc(var(--cs)*-.55)) rotate(14deg) scale(1.2)}}
.ripple{position:absolute;width:calc(var(--cs)*1.1);height:calc(var(--cs)*1.1);left:calc((var(--x) - .05)*var(--cs));top:calc((var(--y) - .05)*var(--cs));border-radius:50%;border:2.5px solid var(--mark);opacity:0;animation:rip .6s .22s ease-out both;pointer-events:none;z-index:1}
@keyframes rip{0%{transform:scale(.5);opacity:.85}100%{transform:scale(2.1);opacity:0}}
.lastDot{position:absolute;width:calc(var(--cs)*.26);height:calc(var(--cs)*.26);left:calc((var(--x) + .5 - .13)*var(--cs));top:calc((var(--y) + .5 - .13)*var(--cs) - var(--cs)*.34);border-radius:50%;background:var(--mark);box-shadow:0 0 0 2px #fff;z-index:300}
.ghost{position:absolute;width:calc(var(--cs)*1.2);height:calc(var(--cs)*1.2);left:calc((var(--x) - .1)*var(--cs));top:calc((var(--y) - .196)*var(--cs));opacity:.45;pointer-events:none;z-index:250}
.ghost svg{width:100%;height:100%;display:block;overflow:visible}
.ghost.confirm{opacity:.8;animation:wob .7s ease-in-out infinite}
@keyframes wob{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.ring{position:absolute;width:calc(var(--cs)*.98);height:calc(var(--cs)*.98);left:calc((var(--x) + .01)*var(--cs));top:calc((var(--y) + .01)*var(--cs));border-radius:50%;border:3px solid var(--hint);box-shadow:0 0 10px var(--hint);animation:pulse 1s ease-in-out infinite;z-index:260;pointer-events:none}
@keyframes pulse{0%,100%{transform:scale(.85);opacity:.9}50%{transform:scale(1.25);opacity:.5}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:400;overflow:visible}
.conf{position:absolute;top:-10%;font-size:calc(var(--cs)*.9);animation:fall linear forwards;z-index:500;pointer-events:none}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(calc(var(--cs)*17)) rotate(360deg);opacity:.9}}
#endBar{display:none;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;background:var(--card);border:2px solid var(--cardB);border-radius:18px;padding:8px 14px;box-shadow:0 6px 18px rgba(0,0,0,.18);font-weight:800;font-size:17px;animation:slideIn .4s ease-out}
#endBar.show{display:flex}
@keyframes slideIn{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.card{background:var(--card);border:2px solid var(--cardB);border-radius:20px;padding:10px 12px;box-shadow:0 6px 16px rgba(0,0,0,.12);width:100%}
.side{display:flex;flex-direction:column;gap:10px;width:100%;min-width:0}
body[data-layout=row] .side{max-width:400px;min-height:0}
body[data-layout=col] .side{display:contents}
body[data-layout=col] .side>.card{width:calc(var(--cs)*15 + var(--pad)*2);max-width:100%}
body[data-layout=col] .boardArea{order:2}body[data-layout=col] .side>.status{order:1}body[data-layout=col] .side>.hud{order:3}body[data-layout=col] .side>.ctl{order:4}body[data-layout=col] .side>.rec{order:5}
.hud{display:flex;align-items:center;gap:10px}
.mascot{flex:0 0 auto;width:68px;height:68px;animation:bob 3s ease-in-out infinite}
.mascot svg{width:100%;height:100%;overflow:visible}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.bubble{position:relative;flex:1;background:var(--bubble);color:var(--bubbleInk);border:2px solid var(--cardB);border-radius:16px;padding:8px 12px;font-size:15px;font-weight:700;min-height:48px;display:flex;align-items:center}
.bubble:before{content:"";position:absolute;left:-9px;top:50%;margin-top:-7px;border:7px solid transparent;border-right-color:var(--cardB);border-left:0}
.status{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}

<script>
/* ===== Omok core: board, win detection, threat-based AI (free-style: 5 or more wins) ===== */
const N=15;
const DIRS=[[1,0],[0,1],[1,1],[1,-1]];
function newBoard(){return new Int8Array(N*N);}
function inb(x,y){return x>=0&&y>=0&&x<N&&y<N;}
/* run of >=5 through (x,y) of the stone there; returns array of cell indexes or null */
function winLine(b,x,y){
  const p=b[y*N+x]; if(!p) return null;
  for(const [dx,dy] of DIRS){
    const cells=[y*N+x];
    for(let s=1;;s++){const nx=x+dx*s,ny=y+dy*s;if(!inb(nx,ny)||b[ny*N+nx]!==p)break;cells.push(ny*N+nx);}
    for(let s=1;;s++){const nx=x-dx*s,ny=y-dy*s;if(!inb(nx,ny)||b[ny*N+nx]!==p)break;cells.unshift(ny*N+nx);}
    if(cells.length>=5) return cells;
  }
  return null;
}
function winsAt(b,x,y,p){ // would p win by playing the empty cell (x,y)?
  b[y*N+x]=p; const w=winLine(b,x,y); b[y*N+x]=0; return !!w;
}
/* ---- pattern levels on a 9-cell line ('x' mine, 'o' blocked/theirs, '.' empty), centre index 4 is mine ---- */
const L_NONE=0,L_ONE=1,L_TWO_C=2,L_TWO_O=3,L_THREE_C=4,L_THREE_O=5,L_FOUR_C=6,L_FOUR_O=7,L_FIVE=8;
const PTS=[0,1,10,60,150,1500,2000,50000,10000000];
const lvCache=new Map();
function fiveInfo(s){
  let five=false; const comp=new Set();
  for(let a=0;a<=4;a++){
    let xs=0,e=-1,bad=false;
    for(let i=a;i<a+5;i++){const c=s[i]; if(c==='x')xs++; else if(c==='.')e=i; else {bad=true;break;}}
    if(bad)continue;
    if(xs===5)five=true; else if(xs===4)comp.add(e);
  }
  return {five,n:comp.size};
}
function lvl(s){
  const k=s.join(''); const c=lvCache.get(k); if(c!==undefined)return c;
  const f=fiveInfo(s); let r;
  if(f.five) r=L_FIVE; else if(f.n>=2) r=L_FOUR_O; else if(f.n===1) r=L_FOUR_C;
  else{

function evalCell(b,x,y,p){

}

function centerBias(i){const x=i%N,y=(i/N)|0;return 14-(Math.abs(x-7)+Math.abs(y-7));}
function scoreMoves(b,p,def){

}

    b[i]=p;

          if(!oppFive && vcf(b,p,depth-1)>=0) win=true;

        }

  }

}
function aiMove(b,p,level,nMoves){
  const q=3-p;
  const mine=threatCells(b,p), theirs=threatCells(b,q);
  if(level==='easy'){
    if(mine.length&&Math.random()<0.65)return mine[0];
    if(theirs.length&&Math.random()<0.45)return theirs[0];
    const c=candidates(b,2);
    if(Math.random()<0.18)return c[(Math.random()*c.length)|0];
    const sc=scoreMoves(b,p,0.35).slice(0,7);
    return sc[(Math.random()*sc.length)|0].i;
  }
  if(mine.length)return mine[0];
  if(theirs.length)return theirs[0];
  if(nMoves===0)return 7*N+7;
  if(level==='normal'){
    const sc=scoreMoves(b,p,0.85);
    if(Math.random()<0.12){const t=sc.slice(0,5);return t[(Math.random()*t.length)|0].i;}

  }

  const sc=scoreMoves(b,p,1.0);

    const x=m.i%N,y=(m.i/N)|0;
    if(m.att>=PTS[L_FIVE]){return m.i;}
    b[m.i]=p;
    let pen=0;
    if(threatCells(b,q).length) pen=1e9;                 // opponent would win next

    else{

      for(const j of c2){const jx=j%N,jy=(j/N)|0; const e=evalCell(b,jx,jy,q); if(e>mx)mx=e;}
      pen=mx*0.7;
    }

    const val=m.s-pen;

}

function canIPlay(){
  if(over||busy)return false;
  if(mode==='ai')return turn===myColor;
  if(mode==='online')return !!onl.gid&&turn===onl.color&&!onl.pushing;
  return true;
}
function setTurnUI(){
  const u=$('turnUse');u.setAttribute('href',sym(over?(winCells?B[winCells[0]]:turn):turn));
  let t;
  if(over)t=$('turnText').textContent;
  else if(mode==='online'){t=!onl.gid?'대결 신청을 해 보자!':(turn===onl.color?'내 차례예요! 👆':`${SIB_NAME} 차례… ⏳`);}
  else if(mode==='ai'){t=turn===myColor?'내 차례예요! 👆':'컴퓨터가 생각 중… 🤔';}
  else t=`${CFG['n'+turn]}팀 차례!`;
  if(!over)$('turnText').textContent=t;
  $('moveCount').textContent=moves.length?`${moves.length}수`:'';
  $('undoBtn').disabled=mode==='online'||over||!moves.length||(mode==='ai'&&busy);
  $('hintBtn').disabled=mode==='online'||over||busy||(mode==='ai'&&turn!==myColor);
}
function newGame(opts){
  seq++;busy=false;over=false;winCells=null;recorded=false;moves=[];clearTimeout(endBarT);
  $('endBar').classList.remove('show');rebuild();
  if(mode==='online'){turn=1;setTurnUI();return;}
  setTurnUI();
  if(mode==='ai'){
    if(myColor===2){say('start_opp');aiTurn();}else say('start_me');
  }else $('say').textContent=`${CFG.n1}팀이 먼저! 번갈아 놓아요~`;
}
function aiTurn(){
  const my=seq;busy=true;setTurnUI();
  setTimeout(()=>{
    if(my!==seq||over)return;
    const t0=performance.now();let m=aiMove(B,3-myColor,level,moves.length);
    busy=false;playMove(m,true);
  },500+Math.random()*450);               // fixed random delay: thinking time never reveals how tense the board is
}
function playMove(idx,animate){
  if(over||B[idx])return false;
  clearGhost();pendingCell=-1;
  const c=turn;B[idx]=c;moves.push(idx);addStone(idx,c,animate!==false);sfx('pop');
  hintCell=-1;$('marks').querySelectorAll('.ring').forEach(e=>e.remove());
  const x=idx%N,y=(idx/N)|0,w=winLine(B,x,y);
  if(w){finish(c,w);return true;}
  if(moves.length>=N*N){finish(0,null);return true;}
  turn=3-turn;drawLast();setTurnUI();
  if(mode==='ai'&&c===myColor&&!over){
    if(Math.random()<.14&&moves.length>4)setTimeout(()=>{if(!over)say('nice');},250);
    aiTurn();
  }
  return true;
}
function handleTap(x,y){
  if(!canIPlay())return;
  const idx=y*N+x;if(B[idx])return;
  if(prefs.confirm){
    if(pendingCell!==idx){pendingCell=idx;showGhost(idx);sfx('tap');return;}
  }
  clearGhost();pendingCell=-1;
  const mover=turn;
  if(!playMove(idx,true))return;
  if(mode==='online')pushOnlineMove(idx,mover);
}
function showGhost(idx){
  clearGhost();const g=document.createElement('div');g.className='ghost'+(prefs.confirm?' confirm':'');g.id='ghost';
  g.style.setProperty('--x',idx%N);g.style.setProperty('--y',(idx/N)|0);g.innerHTML=`<svg viewBox="0 0 100 100"><use href="${sym(turn)}"/></svg>`;$('marks').appendChild(g);
}
function clearGhost(){const g=$('ghost');if(g)g.remove();}
function cellFromEvent(e){
  const r=$('board').getBoundingClientRect(),cs=r.width/15;
  const x=Math.floor((e.clientX-r.left)/cs),y=Math.floor((e.clientY-r.top)/cs);
  return (x<0||y<0||x>=N||y>=N)?null:[x,y];
}
$('board').addEventListener('click',e=>{const c=cellFromEvent(e);if(c)handleTap(c[0],c[1]);});
$('board').addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse'||prefs.confirm||!canIPlay()){if(e.pointerType==='mouse'&&!prefs.confirm)clearGhost();return;}
  const c=cellFromEvent(e);if(!c||B[c[1]*N+c[0]]){clearGhost();return;}
  const g=$('ghost');const idx=c[1]*N+c[0];if(g&&g.dataset.i==idx)return;showGhost(idx);$('ghost').dataset.i=idx;
});
$('board').addEventListener('pointerleave',()=>{if(!prefs.confirm)clearGhost();});

/* ----- finish / records ----- */
function finish(winner,cells){
  over=true;busy=false;winCells=cells;clearGhost();pendingCell=-1;
  document.querySelectorAll('.lastDot').forEach(e=>e.remove());
  let kind,msg;
  if(winner===0){kind='draw';msg='🤝 판이 꽉 찼어요! 무승부!';}
  else if(mode==='friend'){kind='friend';msg=`🎉 ${CFG['n'+winner]}팀 승리! 5목 완성!`;}
  else{kind=winner===me()?'win':'lose';msg=kind==='win'?'🎉 5목 완성! 내가 이겼어요!':'😢 아쉬워요… 다음엔 이길 수 있어요!';}
  if(cells){celebrate(winner,cells);}
  $('turnText').textContent=msg.replace(/^\S+\s/,'');setTurnUI();
  setTimeout(()=>{
    if(kind==='win'||kind==='friend')sfx('win');else if(kind==='lose')sfx('lose');else sfx('draw');
    if(mode==='friend')say(winner===1?'fwin_1':'fwin_2');
    else if(mode==='online')say(kind==='win'?'online_win':kind==='lose'?'online_lose':'draw');
    else say(kind==='win'?'win':kind==='lose'?'lose':'draw');
  },350);
  record(winner);
  $('endMsg').textContent=msg;
  $('againBtn').textContent=mode==='online'?'확인':'한 판 더!';
  endBarT=setTimeout(()=>$('endBar').classList.add('show'),cells?1500:500);
  if(mode==='online')endOnlineGame(winner);
}
function celebrate(winner,cells){
  const st=$('stones');
  const set=new Set(cells);let k=0;
  st.querySelectorAll('.stone').forEach(el=>{
    const i=+el.dataset.i;
    if(set.has(i)){el.classList.remove('drop');el.style.setProperty('--k',k++);el.classList.add('win');el.querySelector('use').setAttribute('href',sym(winner,true));}
    else el.classList.add('dim');
  });
  /* glowing laser line through the winning stones */
  const cs=$('board').getBoundingClientRect().width/15;
  const a=cells[0],b=cells[cells.length-1];
  const ln=document.createElementNS(MS,'svg');ln.setAttribute('width','100%');ln.setAttribute('height','100%');ln.style.cssText='position:absolute;inset:0;overflow:visible';
  const x1=(a%N+.5)*cs,y1=((a/N|0)+.5)*cs,x2=(b%N+.5)*cs,y2=((b/N|0)+.5)*cs,len=Math.hypot(x2-x1,y2-y1);
  ln.innerHTML=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#fff" stroke-width="${cs*.34}" stroke-linecap="round" opacity=".55" style="filter:drop-shadow(0 0 6px var(--gold))" stroke-dasharray="${len}" stroke-dashoffset="${len}"><animate attributeName="stroke-dashoffset" from="${len}" to="0" dur=".6s" fill="freeze"/></line>`;
  $('fx').appendChild(ln);
  const em=CFG.confetti;
  for(let n=0;n<28;n++){const s=document.createElement('span');s.className='conf';s.textContent=em[n%em.length];
    s.style.left=(Math.random()*96)+'%';s.style.animationDuration=(2.2+Math.random()*2)+'s';s.style.animationDelay=(Math.random()*1.2)+'s';$('fx').appendChild(s);}
  setTimeout(()=>{$('fx').querySelectorAll('.conf').forEach(e=>e.remove());},6500);
}
const loadRec=()=>{const r=getJ('Rec',null)||{};r.stats=r.stats||{};
  ['easy','normal','hard','online'].forEach(k=>{if(!r.stats[k])r.stats[k]={w:0,l:0,d:0};});
  if(!r.stats.friend)r.stats.friend={a:0,b:0,d:0};r.recent=r.recent||[];return r;};
const saveRec=r=>setJ('Rec',r);
function record(winner){
  if(recorded)return;recorded=true;
  const r=loadRec();r.player=PLAYER;let e;
  if(mode==='friend'){const f=r.stats.friend;if(winner===0)f.d++;else if(winner===1)f.a++;else f.b++;e={k:'friend',r:winner===0?'d':winner===1?'a':'b'};}
  else{const res=winner===0?'d':(winner===me()?'w':'l');
    const key=mode==='online'?'online':level;r.stats[key][res]++;
    e={k:key,r:res,s:me()===1?'first':'second'};
    if(mode==='online')e.opp=onl.oppName||SIB_NAME;}
  e.t=Date.now();e.n=moves.length;r.recent.unshift(e);r.recent=r.recent.slice(0,10);
  saveRec(r);renderRec();
}
function pct(s){const t=s.w+s.l+s.d;return t?Math.round(s.w*100/t)+'%':'-';}
function renderRec(){
  const r=loadRec(),S=r.stats;
  const row=(label,s)=>`<div class="rrow"><span>${label}</span><span class="c pw">${s.w}</span><span class="c pl">${s.l}</span><span class="c">${s.d}</span><span class="c">${pct(s)}</span></div>`;
  let h=`<div class="rrow hd"><span>모드</span><span class="c">승</span><span class="c">패</span><span class="c">무</span><span class="c">승률</span></div>`;
  h+=row('🌱 쉬움',S.easy)+row('⭐ 보통',S.normal)+row('🔥 어려움',S.hard)+row('🌐 온라인',S.online);
  const f=S.friend;h+=`<div class="rrow"><span>👭 친구</span><span class="c" style="grid-column:span 4;font-size:12.5px">${CFG.n1}팀 ${f.a}승 · ${CFG.n2}팀 ${f.b}승 · 무 ${f.d}</span></div>`;
  const nm={easy:'🌱 쉬움',normal:'⭐ 보통',hard:'🔥 어려움',online:'🌐 온라인',friend:'👭 친구'};
  if(r.recent.length){h+='<div class="recent"><b style="font-size:12.5px;color:var(--sub)">최근 대결</b>';
    r.recent.forEach(e=>{const res=e.k==='friend'?(e.r==='a'?`${CFG.n1}팀 승`:e.r==='b'?`${CFG.n2}팀 승`:'무승부'):(e.r==='w'?'승 🎉':e.r==='l'?'패':'무');
      const d=new Date(e.t);h+=`<div><span>${nm[e.k]||e.k}${e.opp?' vs '+e.opp:''}</span><b>${res}</b><span class="t">${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</span></div>`;});
    h+='</div>';}
  $('recBody').innerHTML=h;

/* ----- undo / hint ----- */
function undo(){
  if(over||!moves.length||mode==='online')return;
  if(mode==='ai'&&busy)return;
  seq++;busy=false;
  if(mode==='ai'){
    moves.pop();                                   // always remove my last move together with the computer's answer
    while(moves.length&&((moves.length%2===0)?1:2)!==myColor)moves.pop();
  }else moves.pop();
  rebuild();sfx('undo');say('undo');setTurnUI();
  if(mode==='ai'&&turn!==myColor)aiTurn();
}
function hint(){
  if(over||busy||mode==='online')return;
  if(mode==='ai'&&turn!==myColor)return;
  const m=aiMove(B,turn,'hard',moves.length);
  $('marks').querySelectorAll('.ring').forEach(e=>e.remove());
  const r=document.createElement('div');r.className='ring';r.style.setProperty('--x',m%N);r.style.setProperty('--y',(m/N)|0);$('marks').appendChild(r);
  hintCell=m;sfx('hint');say('hint');
}

/* ===================== online duel (Firestore: omokPresence / omokChallenges / omokGames) ===================== */
const COL={pres:'omokPresence',chal:'omokChallenges',games:'omokGames'};
const onl={oppUid:null,uid:null,gid:null,color:0,oppName:'',unsubs:[],gameUnsub:null,presTimer:null,sibUid:null,sibAt:0,sibOn:false,outChal:null,inChal:null,inData:null,pushing:false,applied:0,pending:null,ending:false};
function waitFB(){return new Promise(res=>{if(window.__KidsFB&&window.__KidsFB.ready)return res(window.__KidsFB);
  const t=setTimeout(()=>res(window.__KidsFB||null),12000);addEventListener('kidsfb-ready',()=>{clearTimeout(t);res(window.__KidsFB);},{once:true});});}
async function ensureAuth(){
  const fb=await waitFB();if(!fb){toast('온라인 연결을 불러오지 못했어 😢');return null;}
  if(fb.auth.currentUser){onl.uid=fb.auth.currentUser.uid;return fb;}
  try{const c=await fb.signInAnonymously();onl.uid=c.user.uid;return fb;}catch(e){console.error(e);toast('로그인에 실패했어. 인터넷을 확인해 줘!');return null;}
}
async function beat(on){const fb=window.__KidsFB;if(!fb||!onl.uid)return;
  try{await fb.setDoc(fb.doc(fb.db,COL.pres,MY_PRES),{name:PLAYER,theme:CFG.theme,uid:onl.uid,updatedAt:Date.now(),online:!!on},{merge:true});}catch(e){console.warn('presence',e);}}
function presUI(){
  const live=onl.sibOn&&(Date.now()-onl.sibAt)<45000&&!!onl.sibUid;
  $('sibDot').classList.toggle('on',live);
  $('sibStatus').textContent=live?`${SIB_NAME}가 접속 중! ✨`:`${SIB_NAME} 아직 안 접속`;
  const inGame=!!onl.gid;
  $('challengeBtn').style.display=inGame?'none':'';
  $('challengeBtn').disabled=!live||!!onl.outChal;
  $('cancelChalBtn').style.display=(onl.outChal&&!inGame)?'':'none';
  $('resignBtn').style.display=(inGame&&!over)?'':'none';
  $('onlineHint').textContent=inGame?(onl.color===1?`너는 ${CFG.n1}(선공)! ${SIB_NAME}와 실시간 대결 중`:`너는 ${CFG.n2}(후공)! ${SIB_NAME}와 실시간 대결 중`)
    :onl.outChal?`${SIB_NAME}의 대답을 기다리는 중…`:'신청한 쪽이 선공이에요. 둘 다 온라인 모드로 들어와야 해요!';
}
function offOnline(){onl.unsubs.forEach(u=>{try{u();}catch(e){}});onl.unsubs=[];if(onl.presTimer){clearInterval(onl.presTimer);onl.presTimer=null;}
  if(onl.gameUnsub){try{onl.gameUnsub();}catch(e){}onl.gameUnsub=null;}}
async function startOnline(){
  offOnline();onl.gid=null;onl.outChal=null;onl.inChal=null;newGame();
  const fb=await ensureAuth();if(!fb){presUI();return;}
  if(mode!=='online')return;
  await beat(true);onl.presTimer=setInterval(()=>{beat(true);presUI();},20000);
  onl.unsubs.push(fb.onSnapshot(fb.doc(fb.db,COL.pres,SIB_PRES),snap=>{
    if(!snap.exists()){onl.sibOn=false;onl.sibUid=null;onl.sibAt=0;presUI();return;}
    const d=snap.data();onl.sibUid=d.uid||null;onl.sibAt=d.updatedAt||0;onl.sibOn=!!d.online;presUI();},e=>console.warn(e)));
  onl.unsubs.push(fb.onSnapshot(fb.query(fb.collection(fb.db,COL.chal),fb.where('toUid','==',onl.uid)),snap=>{
    let found=null,fid=null;
    snap.forEach(dd=>{const d=dd.data();if(d.status==='pending'&&Date.now()-(d.createdAt||0)<180000&&!found){found=d;fid=dd.id;}});
    if(found&&!onl.gid){
      if(fid!==onl.inChal){onl.inChal=fid;onl.inData=found;$('chalWho').textContent=found.fromName||SIB_NAME;$('chalSub').textContent=`${found.fromName||SIB_NAME}가 대결 신청했어!`;$('challengeModal').classList.add('show');sfx('ding');say('challenge');}
    }else if(!found&&onl.inChal){$('challengeModal').classList.remove('show');onl.inChal=null;onl.inData=null;}
  },e=>console.warn('chal',e)));
  presUI();setTurnUI();say('hi',{silent:true});toast('온라인 모드야! 상대가 들어오면 대결 신청해 봐');
}
async function sendChallenge(){
  const fb=await ensureAuth();if(!fb||!onl.sibUid||onl.outChal||onl.gid)return;
  try{
    const ref=await fb.addDoc(fb.collection(fb.db,COL.chal),{fromUid:onl.uid,fromName:PLAYER,fromTheme:CFG.theme,toUid:onl.sibUid,toName:SIB_NAME,status:'pending',createdAt:Date.now()});
    onl.outChal=ref.id;toast(`대결 신청 보냈어! ${SIB_NAME} 대답 기다리는 중…`);presUI();
    const u=fb.onSnapshot(ref,async snap=>{
      if(!snap.exists()){onl.outChal=null;presUI();return;}
      const d=snap.data();
      if(d.status==='declined'){toast(`${SIB_NAME}가 거절했어 😢`);onl.outChal=null;presUI();try{await fb.deleteDoc(ref);}catch(e){}}
      else if(d.status==='cancelled'){onl.outChal=null;presUI();try{await fb.deleteDoc(ref);}catch(e){}}
      else if(d.status==='accepted'&&d.gameId){onl.outChal=null;try{u();}catch(e){}await joinGame(d.gameId);try{await fb.deleteDoc(ref);}catch(e){}}
    });onl.unsubs.push(u);
  }catch(e){console.error(e);toast('신청에 실패했어 😢');}
}
async function cancelChallenge(){const fb=window.__KidsFB;if(!fb||!onl.outChal)return;
  try{await fb.updateDoc(fb.doc(fb.db,COL.chal,onl.outChal),{status:'cancelled'});}catch(e){}onl.outChal=null;presUI();toast('신청을 취소했어');}
async function declineChallenge(){const fb=window.__KidsFB;if(!fb||!onl.inChal)return;
  try{await fb.updateDoc(fb.doc(fb.db,COL.chal,onl.inChal),{status:'declined'});}catch(e){}
  $('challengeModal').classList.remove('show');onl.inChal=null;onl.inData=null;toast('거절했어');}
async function acceptChallenge(){
  const fb=await ensureAuth();if(!fb||!onl.inChal||!onl.inData)return;
  const d=onl.inData,cid=onl.inChal;
  try{
    // the challenger plays first (black-equivalent); the accepter plays second
    const g=await fb.addDoc(fb.collection(fb.db,COL.games),{blackUid:d.fromUid,whiteUid:onl.uid,blackName:d.fromName||SIB_NAME,whiteName:PLAYER,
      moves:[],status:'active',winnerUid:null,reason:null,createdAt:Date.now(),updatedAt:Date.now()});
    await fb.updateDoc(fb.doc(fb.db,COL.chal,cid),{status:'accepted',gameId:g.id});
    $('challengeModal').classList.remove('show');onl.inChal=null;onl.inData=null;
    await joinGame(g.id);
  }catch(e){console.error(e);toast('대결 시작에 실패했어 😢');}
}
async function joinGame(gid){
  const fb=window.__KidsFB;if(!fb)return;
  let g;
  for(let i=0;i<5;i++){try{const s=await fb.getDoc(fb.doc(fb.db,COL.games,gid));if(s.exists()){g=s.data();break;}}catch(e){}await new Promise(r=>setTimeout(r,500));}
  if(!g){toast('게임을 찾지 못했어');return;}
  seq++;onl.gid=gid;onl.color=g.blackUid===onl.uid?1:2;onl.oppName=onl.color===1?g.whiteName:g.blackName;onl.oppUid=onl.color===1?g.whiteUid:g.blackUid;onl.pushing=false;onl.ending=false;
  over=false;winCells=null;recorded=false;busy=false;moves=[];clearTimeout(endBarT);$('endBar').classList.remove('show');
  rebuild();(g.moves||[]).forEach(i=>{B[i]=turn;moves.push(i);$('stones').appendChild(stoneEl(i,turn));turn=3-turn;});
  onl.applied=moves.length;drawLast();presUI();setTurnUI();
  toast(onl.color===1?`대결 시작! 네가 ${CFG.n1}(선공)`:`대결 시작! 네가 ${CFG.n2}(후공)`);say('online_start');
  onl.gameUnsub=fb.onSnapshot(fb.doc(fb.db,COL.games,gid),snap=>{
    if(!snap.exists())return;const d=snap.data();const rm=d.moves||[];
    while(onl.applied<rm.length&&!over){            // apply the opponent's moves in order
      const idx=rm[onl.applied];
      if(moves.length>onl.applied){onl.applied++;continue;}     // already applied locally (my own move)
      onl.applied++;playMove(idx,true);
    }
    if(d.status==='ended'&&!over){                    // resign / disconnect
      const won=d.winnerUid===onl.uid;
      over=true;winCells=null;clearGhost();recorded=false;
      const msg=won?`🎉 ${onl.oppName}가 기권했어! 내가 이겼어요!`:'끝났어요';
      $('turnText').textContent=won?'상대가 기권했어요!':'대결이 끝났어요';
      $('endMsg').textContent=msg;$('endBar').classList.add('show');mode==='online'&&record(won?onl.color:3-onl.color);
      if(won){sfx('win');say('online_win');}setTurnUI();presUI();
    }
    presUI();setTurnUI();
  },e=>console.warn('game',e));
}
async function pushOnlineMove(idx,mover){
  const fb=window.__KidsFB;if(!fb||!onl.gid)return;
  const my=moves.length-1;onl.pushing=true;setTurnUI();
  const ended=over;                                  // my move just won / filled the board
  try{
    await fb.runTransaction(fb.db,async tx=>{
      const ref=fb.doc(fb.db,COL.games,onl.gid),s=await tx.get(ref);
      if(!s.exists())throw new Error('gone');
      const d=s.data(),cur=d.moves||[];
      if(cur.length!==my)throw new Error('desync '+cur.length+' vs '+my);
      const up={moves:cur.concat([idx]),updatedAt:Date.now()};
      if(ended){up.status='ended';up.winnerUid=winCells?onl.uid:null;up.reason=winCells?'five':'full';}
      tx.update(ref,up);
    });
    onl.applied=Math.max(onl.applied,moves.length);
  }catch(e){console.error('push move',e);toast('수 전송 실패… 인터넷을 확인해 줘');}
  onl.pushing=false;setTurnUI();
}
async function endOnlineGame(winner){ /* result already carried by the final move; nothing more to write */ }
async function resignOnline(){
  const fb=window.__KidsFB;if(!fb||!onl.gid||over)return;
  over=true;
  try{await fb.updateDoc(fb.doc(fb.db,COL.games,onl.gid),{status:'ended',winnerUid:onl.oppUid,reason:'resign',updatedAt:Date.now()});}catch(e){console.warn(e);}
  $('turnText').textContent='기권했어요';$('endMsg').textContent='🏳️ 기권했어요… 다음엔 이길 수 있어요!';$('endBar').classList.add('show');
  record(3-onl.color);sfx('lose');setTurnUI();presUI();
}
function leaveOnlineGameUI(){ // after a finished online game: back to the idle online board
  if(onl.gameUnsub){try{onl.gameUnsub();}catch(e){}onl.gameUnsub=null;}
  onl.gid=null;onl.color=0;onl.applied=0;over=false;winCells=null;recorded=false;moves=[];rebuild();presUI();setTurnUI();$('endBar').classList.remove('show');
}
async function leaveOnline(){
  const fb=window.__KidsFB;
  if(onl.gid&&!over){over=true;record(3-onl.color);try{await fb.updateDoc(fb.doc(fb.db,COL.games,onl.gid),{status:'ended',winnerUid:onl.oppUid,reason:'left',updatedAt:Date.now()});}catch(e){}}
  if(onl.outChal)await cancelChallenge();
  await beat(false);offOnline();onl.gid=null;onl.color=0;onl.applied=0;$('challengeModal').classList.remove('show');
}
addEventListener('pagehide',()=>{try{if(mode==='online'){beat(false);if(onl.gid&&!over){const fb=window.__KidsFB;fb.updateDoc(fb.doc(fb.db,COL.games,onl.gid),{status:'ended',winnerUid:onl.oppUid,reason:'left',updatedAt:Date.now()});}}}catch(e){}});

/* ===================== boot ===================== */
window.__omok={get audio(){return {ac:AC&&AC.state,voiceLoaded:!!VMAN,bufs:VBUF.size,music:!!musicTimer,unlocked};},get B(){return B;},get moves(){return moves;},get over(){return over;},get turn(){return turn;},get mode(){return mode;},handleTap,playMove,newGame,setMode,onl,get level(){return level;}};
layout();syncSegs();renderRec();setMode('ai');
setTimeout(layout,150);
</script>
